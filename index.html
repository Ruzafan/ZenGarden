<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jardín Karesansui</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Un jardín zen japonés interactivo: rastrilla la arena, dibuja ondas y coloca piedras, con sonido de arena.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
/* Layout: full-bleed raked-sand canvas; a quiet ink title top-left; a floating charcoal tool tray at the bottom edge */
:root {
  --sand: #d8d1c1;
  --ink: #2e2c28;
  --ink-soft: rgba(46, 44, 40, .62);
  --tray: rgba(36, 34, 31, .80);
  --tray-fg: #efe9dc;
  --tray-dim: #a39c8d;
  --moss: #95a86a;
  --font-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--sand);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
}
#garden {
  position: fixed; inset: 0;
  touch-action: none;
  cursor: crosshair;
}
#garden canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#vignette {
  position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(60,45,25,.16) 100%);
}

header {
  position: fixed; top: 0; left: 0; right: 0;
  padding-top: calc(env(safe-area-inset-top, 0px) + 18px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
  display: grid; gap: 4px;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(22px, 3.2vw, 30px);
  letter-spacing: .02em;
  line-height: 1.1;
  display: flex; align-items: baseline; gap: .45em;
  text-wrap: balance;
  text-shadow: 0 0 8px var(--sand);
}
h1 .kanji { font-weight: 500; letter-spacing: .12em; }
h1 .latin { font-size: .62em; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-soft); }
#hint {
  margin: 0; font-size: 14px; color: var(--ink-soft);
  text-shadow: 0 0 6px var(--sand), 0 0 2px var(--sand);
  max-width: 34ch; line-height: 1.45;
  transition: opacity .4s ease;
}

#dock {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  pointer-events: none;
}
.tray {
  pointer-events: auto;
  background: var(--tray);
  -webkit-backdrop-filter: blur(10px) saturate(1.1);
  backdrop-filter: blur(10px) saturate(1.1);
  color: var(--tray-fg);
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(40, 28, 12, .28);
  display: flex; flex-wrap: wrap; justify-content: center; align-items: stretch;
  gap: 2px; padding: 6px;
  max-width: 100%;
}
.tray .sep { width: 1px; background: rgba(239,233,220,.16); margin: 8px 4px; }
.tool {
  appearance: none; border: 0; background: transparent; color: var(--tray-dim);
  font: 500 11.5px/1 var(--font-body); letter-spacing: .04em;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  min-width: 58px; padding: 9px 6px 8px; border-radius: 12px; cursor: pointer;
  transition: color .2s, background-color .2s;
}
.tool svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tool:hover { color: var(--tray-fg); }
.tool[aria-pressed="true"] { color: var(--tray-fg); background: rgba(239,233,220,.12); }
.tool[aria-pressed="true"] .dot { opacity: 1; }
.tool .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--moss); opacity: 0; margin-top: -2px; }
.tool:focus-visible, .chip:focus-visible { outline: 2px solid var(--moss); outline-offset: 1px; }

.tines {
  pointer-events: auto;
  display: flex; align-items: center; gap: 4px;
  padding: 5px 6px 5px 14px; border-radius: 999px;
  background: var(--tray); color: var(--tray-dim);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  font-size: 12px; letter-spacing: .06em;
  transition: opacity .25s, transform .25s;
}
.tines.off { opacity: 0; transform: translateY(6px); pointer-events: none; }
.tines span { margin-right: 4px; }
.chip {
  appearance: none; border: 0; cursor: pointer;
  background: transparent; color: var(--tray-dim);
  font: 500 13px/1 var(--font-body); font-variant-numeric: tabular-nums;
  min-width: 34px; height: 28px; border-radius: 999px;
}
.chip[aria-pressed="true"] { background: rgba(239,233,220,.16); color: var(--tray-fg); }

@media (max-width: 420px) {
  .tool { min-width: 50px; padding-inline: 3px; font-size: 10.5px; }
  .tray .sep { margin-inline: 1px; }
}
@media (prefers-reduced-motion: reduce) {
  .tines, #hint, .tool { transition: none; }
}
</style>
</head>
<body>

<div id="garden" aria-label="Jardín de arena. Arrastra para rastrillar." role="img">
  <canvas id="sand"></canvas>
  <canvas id="top"></canvas>
</div>
<div id="vignette"></div>

<header>
  <h1><span class="kanji">枯山水</span><span class="latin">Karesansui</span></h1>
  <p id="hint">Arrastra para rastrillar la arena</p>
</header>

<div id="dock">
  <div class="tines" id="tines" role="group" aria-label="Púas del rastrillo">
    <span>Púas</span>
    <button class="chip" data-tines="3" aria-pressed="false">3</button>
    <button class="chip" data-tines="5" aria-pressed="true">5</button>
    <button class="chip" data-tines="8" aria-pressed="false">8</button>
  </div>
  <nav class="tray" aria-label="Herramientas">
    <button class="tool" id="t-rake" data-tool="rake" aria-pressed="true" title="Rastrillo (1)">
      <svg viewBox="0 0 24 24"><path d="M12 2v11"/><path d="M4 13h16"/><path d="M5 13v5M9 13v6M12 13v6M15 13v6M19 13v5"/></svg>
      Rastrillo<i class="dot"></i>
    </button>
    <button class="tool" id="t-ripple" data-tool="ripple" aria-pressed="false" title="Ondas (2)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="9"/></svg>
      Ondas<i class="dot"></i>
    </button>
    <button class="tool" id="t-stone" data-tool="stone" aria-pressed="false" title="Piedra (3)">
      <svg viewBox="0 0 24 24"><path d="M5 16.5c-1.6-3.4.6-8 4.6-9.3 4-1.4 8.4.4 9.6 3.8 1.1 3.1-.9 6.6-5.2 7.4-3.7.7-7.7.6-9-1.9z"/><path d="M3 20.5h18"/></svg>
      Piedra<i class="dot"></i>
    </button>
    <button class="tool" id="t-smooth" data-tool="smooth" aria-pressed="false" title="Alisar (4)">
      <svg viewBox="0 0 24 24"><path d="M3 15c3-2.5 6-2.5 9 0s6 2.5 9 0"/><path d="M3 9.5c3-1.5 6-1.5 9 0s6 1.5 9 0" opacity=".45"/></svg>
      Alisar<i class="dot"></i>
    </button>
    <i class="sep" aria-hidden="true"></i>
    <button class="tool" id="t-sound" aria-pressed="true" title="Sonido (S)">
      <svg viewBox="0 0 24 24" id="ico-sound"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path class="w" d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.5 7.5 0 0 1 0 10.4"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5" style="display:none"/></svg>
      Sonido<i class="dot"></i>
    </button>
    <button class="tool" id="t-clear" title="Alisar todo el jardín">
      <svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4 4v4h4"/></svg>
      Empezar<i class="dot"></i>
    </button>
  </nav>
</div>

<script>
(() => {
  "use strict";
  const garden = document.getElementById("garden");
  const sandCv = document.getElementById("sand");
  const sctx = sandCv.getContext("2d");
  const topCv = document.getElementById("top");
  const tctx = topCv.getContext("2d");
  const hintEl = document.getElementById("hint");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const SP = 10;            // distance between grooves, in px
  const TAU = Math.PI * 2;
  let W = 0, H = 0, DPR = 1;
  let hgt, grain, mask, img, pix;
  let dirty = null;
  let tool = "rake", tines = 5, soundOn = true;
  const stones = [];

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };

  // ---------- Sand height field ----------
  function markDirty(x0, y0, x1, y1) {
    x0 = Math.max(0, Math.floor(x0) - 1); y0 = Math.max(0, Math.floor(y0) - 1);
    x1 = Math.min(W, Math.ceil(x1) + 2); y1 = Math.min(H, Math.ceil(y1) + 2);
    if (x1 <= x0 || y1 <= y0) return;
    if (!dirty) dirty = { x0, y0, x1, y1 };
    else { dirty.x0 = Math.min(dirty.x0, x0); dirty.y0 = Math.min(dirty.y0, y0); dirty.x1 = Math.max(dirty.x1, x1); dirty.y1 = Math.max(dirty.y1, y1); }
  }

  function makeGrain(w, h) {
    const g = new Float32Array(w * h);
    const cs = 7, gw = Math.ceil(w / cs) + 2, gh = Math.ceil(h / cs) + 2;
    const coarse = new Float32Array(gw * gh);
    for (let i = 0; i < coarse.length; i++) coarse[i] = Math.random() * 2 - 1;
    for (let y = 0; y < h; y++) {
      const fy = y / cs, iy = fy | 0, ty = fy - iy;
      for (let x = 0; x < w; x++) {
        const fx = x / cs, ix = fx | 0, tx = fx - ix;
        const a = coarse[iy * gw + ix], b = coarse[iy * gw + ix + 1];
        const c = coarse[(iy + 1) * gw + ix], d = coarse[(iy + 1) * gw + ix + 1];
        const cv = (a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty;
        let v = (Math.random() * 2 - 1) * 0.045 + cv * 0.025;
        const r = Math.random();
        if (r < 0.012) v -= 0.16; else if (r < 0.02) v += 0.10;
        g[y * w + x] = v;
      }
    }
    return g;
  }

  function linePattern(x, y) {
    const yy = y + Math.sin(x / 230) * 9 + Math.sin(x / 91 + 1.3) * 2.2;
    return -Math.cos(TAU * yy / SP);
  }

  function shadeRect(x0, y0, x1, y1) {
    const h = hgt, g = grain, d = pix, w = W;
    for (let y = y0; y < y1; y++) {
      const yr = y * w, ym = (y > 0 ? y - 1 : y) * w, yp = (y < H - 1 ? y + 1 : y) * w;
      for (let x = x0; x < x1; x++) {
        const i = yr + x;
        const dx = h[x < w - 1 ? i + 1 : i] - h[x > 0 ? i - 1 : i];
        const dy = h[yp + x] - h[ym + x];
        let s = 0.88 + (dx * 0.55 + dy * 0.8) * 0.19 + h[i] * 0.03 + g[i];
        s = s < 0.42 ? 0.42 : s > 1.22 ? 1.22 : s;
        const j = i << 2;
        d[j] = 224 * s;
        d[j + 1] = 215 * s;
        d[j + 2] = 197 * s + (1 - s) * 26;
      }
    }
  }

  function flush() {
    if (!dirty) return;
    const { x0, y0, x1, y1 } = dirty;
    dirty = null;
    shadeRect(x0, y0, x1, y1);
    sctx.putImageData(img, 0, 0, x0, y0, x1 - x0, y1 - y0);
  }

  function setup(keep) {
    const nw = Math.max(1, Math.round(garden.clientWidth));
    const nh = Math.max(1, Math.round(garden.clientHeight));
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const old = hgt, ow = W, oh = H;
    W = nw; H = nh;
    hgt = new Float32Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      hgt[y * W + x] = (keep && old && x < ow && y < oh) ? old[y * ow + x] : linePattern(x, y);
    }
    grain = makeGrain(W, H);
    mask = new Uint8Array(W * H);
    sandCv.width = W; sandCv.height = H;
    topCv.width = Math.round(W * DPR); topCv.height = Math.round(H * DPR);
    img = sctx.createImageData(W, H);
    pix = img.data;
    for (let i = 3; i < pix.length; i += 4) pix[i] = 255;
    for (const s of stones) { s.x = clamp(s.x, 0, W); s.y = clamp(s.y, 0, H); }
    for (const s of stones) renderStone(s);
    rebuildMask();
    markDirty(0, 0, W, H);
  }

  // ---------- Tools on the sand ----------
  function rakeStamp(cx, cy, dx, dy, len) {
    const nx = -dy, ny = dx, s = SP, R = tines * s / 2;
    const half = len / 2 + 1.6, ext = R + s, off = tines % 2 === 0 ? 0.5 : 0;
    const x0 = Math.max(0, (cx - ext) | 0), x1 = Math.min(W, (cx + ext + 1) | 0);
    const y0 = Math.max(0, (cy - ext) | 0), y1 = Math.min(H, (cy + ext + 1) | 0);
    const inner = R - s * 0.5, outer = R + s * 0.6;
    for (let y = y0; y < y1; y++) {
      const py = y - cy;
      for (let x = x0; x < x1; x++) {
        const px = x - cx;
        const v = px * dx + py * dy;
        if (v > half || v < -half) continue;
        const u = px * nx + py * ny, au = u < 0 ? -u : u;
        if (au > outer) continue;
        const i = y * W + x;
        if (mask[i]) continue;
        const pat = -Math.cos(TAU * (u / s + off));
        const w = au <= inner ? 0.7 : 0.7 * (1 - smooth(inner, outer, au));
        hgt[i] += (pat - hgt[i]) * w;
      }
    }
    markDirty(x0, y0, x1, y1);
  }

  function rippleStamp(cx, cy, r0, r1) {
    const s = SP, ext = r1 + s;
    const x0 = Math.max(0, (cx - ext) | 0), x1 = Math.min(W, (cx + ext + 1) | 0);
    const y0 = Math.max(0, (cy - ext) | 0), y1 = Math.min(H, (cy + ext + 1) | 0);
    const inMin = Math.max(0, r0 - s * 1.5), outer = r1 + s * 0.5, edge = r1 - s * 0.6;
    for (let y = y0; y < y1; y++) {
      const py = y - cy;
      for (let x = x0; x < x1; x++) {
        const px = x - cx, d = Math.sqrt(px * px + py * py);
        if (d > outer || d < inMin) continue;
        const i = y * W + x;
        if (mask[i]) continue;
        const pat = -Math.cos(TAU * d / s);
        const w = 1 - smooth(edge, outer, d);
        hgt[i] += (pat - hgt[i]) * w;
      }
    }
    markDirty(x0, y0, x1, y1);
  }

  function smoothStamp(cx, cy) {
    const R = 28;
    const x0 = Math.max(0, (cx - R) | 0), x1 = Math.min(W, (cx + R + 1) | 0);
    const y0 = Math.max(0, (cy - R) | 0), y1 = Math.min(H, (cy + R + 1) | 0);
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
      const px = x - cx, py = y - cy, d = Math.sqrt(px * px + py * py);
      if (d > R) continue;
      const i = y * W + x;
      if (mask[i]) continue;
      hgt[i] *= 1 - 0.32 * (1 - smooth(R * 0.45, R, d));
    }
    markDirty(x0, y0, x1, y1);
  }

  // ---------- Stones ----------
  const TONES = [
    { hi: "#9a9894", mid: "#64625e", lo: "#2f2e2c" },  // slate
    { hi: "#b3aa9b", mid: "#7c7466", lo: "#3e3a33" },  // warm granite
    { hi: "#8f948d", mid: "#5b605a", lo: "#272a27" },  // green-grey river stone
  ];

  function makeStone(x, y, r) {
    const asp = 1 + Math.random() * 0.35;
    const st = {
      x, y, a: r * asp, b: r / Math.sqrt(asp) , rot: Math.random() * Math.PI,
      ph: [Math.random() * TAU, Math.random() * TAU, Math.random() * TAU],
      tone: TONES[(Math.random() * TONES.length) | 0],
      moss: Math.random() < 0.55, seed: Math.random() * 1e6, cv: null, R: 0,
    };
    return st;
  }

  function stoneRho(st, t) {
    return 1 + 0.06 * Math.sin(2 * t + st.ph[0]) + 0.04 * Math.sin(3 * t + st.ph[1]) + 0.02 * Math.sin(5 * t + st.ph[2]);
  }
  function stonePath(c, st, scale) {
    c.beginPath();
    const cr = Math.cos(st.rot), sr = Math.sin(st.rot);
    for (let k = 0; k <= 64; k++) {
      const t = k / 64 * TAU, rho = stoneRho(st, t) * scale;
      const lx = Math.cos(t) * st.a * rho, ly = Math.sin(t) * st.b * rho;
      const X = lx * cr - ly * sr, Y = lx * sr + ly * cr;
      k ? c.lineTo(X, Y) : c.moveTo(X, Y);
    }
    c.closePath();
  }
  function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

  function renderStone(st) {
    const R = Math.max(st.a, st.b) * 1.3 + 28;
    st.R = R;
    const cv = document.createElement("canvas");
    cv.width = cv.height = Math.ceil(R * 2 * DPR);
    const c = cv.getContext("2d");
    c.scale(DPR, DPR); c.translate(R, R);
    const rand = rng(st.seed);
    // cast shadow
    c.save();
    c.shadowColor = "rgba(52, 38, 20, .55)"; c.shadowBlur = 16; c.shadowOffsetX = 8; c.shadowOffsetY = 10;
    stonePath(c, st, 1); c.fillStyle = st.tone.lo; c.fill();
    c.restore();
    // moss collar
    if (st.moss) {
      const greens = ["#6f7f45", "#86975a", "#9cae6c", "#5d6c3a", "#a9b97a"];
      const cr = Math.cos(st.rot), sr = Math.sin(st.rot);
      const start = rand() * TAU, span = TAU * (0.45 + rand() * 0.5);
      for (let k = 0; k < 420; k++) {
        const t = start + rand() * span, rho = stoneRho(st, t) * (0.96 + Math.pow(rand(), 1.6) * 0.22);
        const lx = Math.cos(t) * st.a * rho, ly = Math.sin(t) * st.b * rho;
        c.fillStyle = greens[(rand() * greens.length) | 0];
        c.globalAlpha = 0.55 + rand() * 0.45;
        c.beginPath(); c.arc(lx * cr - ly * sr, lx * sr + ly * cr, 1.2 + rand() * 2.6, 0, TAU); c.fill();
      }
      c.globalAlpha = 1;
    }
    // body
    c.save();
    stonePath(c, st, 1); c.clip();
    const m = Math.max(st.a, st.b);
    const g = c.createRadialGradient(-st.a * 0.35, -st.b * 0.45, m * 0.05, 0, 0, m * 1.15);
    g.addColorStop(0, st.tone.hi); g.addColorStop(0.5, st.tone.mid); g.addColorStop(1, st.tone.lo);
    c.fillStyle = g; c.fillRect(-R, -R, 2 * R, 2 * R);
    for (let k = 0; k < m * m * 0.5; k++) {
      const x = (rand() * 2 - 1) * m * 1.1, y = (rand() * 2 - 1) * m * 1.1;
      c.fillStyle = rand() < 0.5 ? "rgba(255,255,255,.10)" : "rgba(0,0,0,.14)";
      c.fillRect(x, y, 1 + rand() * 1.4, 1 + rand() * 1.4);
    }
    // faint strata
    c.strokeStyle = "rgba(255,255,255,.07)"; c.lineWidth = 1.2;
    for (let k = 0; k < 3; k++) {
      const off = (rand() * 2 - 1) * m * 0.6;
      c.beginPath(); c.moveTo(-m, off); c.bezierCurveTo(-m * 0.3, off + (rand() - .5) * m * .5, m * 0.3, off + (rand() - .5) * m * .5, m, off + (rand() - .5) * m * .3); c.stroke();
    }
    const rim = c.createRadialGradient(0, 0, m * 0.6, 0, 0, m * 1.1);
    rim.addColorStop(0, "rgba(0,0,0,0)"); rim.addColorStop(1, "rgba(0,0,0,.35)");
    c.fillStyle = rim; c.fillRect(-R, -R, 2 * R, 2 * R);
    c.restore();
    st.cv = cv;
  }

  function stoneNorm(st, x, y) {
    const px = x - st.x, py = y - st.y, cr = Math.cos(st.rot), sr = Math.sin(st.rot);
    const lx = px * cr + py * sr, ly = -px * sr + py * cr;
    return Math.sqrt((lx / st.a) ** 2 + (ly / st.b) ** 2);
  }

  function rebuildMask() {
    mask.fill(0);
    for (const st of stones) {
      const m = Math.max(st.a, st.b);
      const x0 = Math.max(0, (st.x - m) | 0), x1 = Math.min(W, (st.x + m + 1) | 0);
      const y0 = Math.max(0, (st.y - m) | 0), y1 = Math.min(H, (st.y + m + 1) | 0);
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) if (stoneNorm(st, x, y) < 0.9) mask[y * W + x] = 1;
    }
  }

  function stoneRings(st) {
    const s = SP, ring = 5 * s, rAvg = (st.a + st.b) / 2, m = Math.max(st.a, st.b) + ring + s;
    const x0 = Math.max(0, (st.x - m) | 0), x1 = Math.min(W, (st.x + m + 1) | 0);
    const y0 = Math.max(0, (st.y - m) | 0), y1 = Math.min(H, (st.y + m + 1) | 0);
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
      const i = y * W + x;
      const de = (stoneNorm(st, x, y) - 1) * rAvg;
      if (de > ring) continue;
      if (de < 0) { if (mask[i]) hgt[i] = 0.5; continue; }
      if (mask[i]) continue;
      const pat = -Math.cos(TAU * (de - s * 0.5) / s);
      const w = 1 - smooth(ring - s, ring, de);
      hgt[i] += (pat - hgt[i]) * w;
    }
    markDirty(x0, y0, x1, y1);
  }

  function liftStone(st) {
    const m = Math.max(st.a, st.b) * 1.05;
    const x0 = Math.max(0, (st.x - m) | 0), x1 = Math.min(W, (st.x + m + 1) | 0);
    const y0 = Math.max(0, (st.y - m) | 0), y1 = Math.min(H, (st.y + m + 1) | 0);
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
      const n = stoneNorm(st, x, y);
      if (n < 1.05) { const i = y * W + x; hgt[i] = -0.25 * (1 - smooth(0.7, 1.05, n)) + hgt[i] * smooth(0.7, 1.05, n) * 0.4; }
    }
    markDirty(x0, y0, x1, y1);
  }

  function addStone(x, y, r) {
    const base = clamp(Math.min(W, H) * 0.075, 26, 66);
    const st = makeStone(x, y, r || base * (0.55 + Math.random() * 0.45));
    stones.push(st);
    renderStone(st);
    rebuildMask();
    stoneRings(st);
    return st;
  }

  function hitStone(x, y) {
    for (let k = stones.length - 1; k >= 0; k--) if (stoneNorm(stones[k], x, y) < 1.12) return stones[k];
    return null;
  }

  // ---------- Petals (ambient) ----------
  const petals = [];
  let nextPetal = 2500;
  function spawnPetal() {
    const fromLeft = Math.random() < 0.7;
    petals.push({
      x: fromLeft ? -20 : Math.random() * W * 0.8, y: fromLeft ? Math.random() * H * 0.6 : -20,
      vx: 0.018 + Math.random() * 0.02, vy: 0.012 + Math.random() * 0.012,
      rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 0.002,
      ph: Math.random() * TAU, size: 5 + Math.random() * 4, life: 0,
      land: 0.35 + Math.random() * 0.6, tone: Math.random() < 0.5 ? "#f2c9d0" : "#f6dde0",
    });
  }
  function drawPetal(c, p) {
    c.save();
    c.translate(p.x, p.y); c.rotate(p.rot);
    c.scale(1, 0.35 + 0.65 * Math.abs(Math.cos(p.ph)));
    const s = p.size;
    c.beginPath();
    c.moveTo(0, -s);
    c.bezierCurveTo(s * 0.9, -s * 0.6, s * 0.7, s * 0.7, 0, s);
    c.bezierCurveTo(-s * 0.7, s * 0.7, -s * 0.9, -s * 0.6, 0, -s);
    c.moveTo(0, -s); c.lineTo(-s * 0.18, -s * 0.72); c.lineTo(s * 0.18, -s * 0.72);
    c.fillStyle = p.tone; c.globalAlpha = p.alpha; c.fill();
    c.restore();
  }

  // ---------- Overlay: stones, rake, petals ----------
  const rakeVis = { on: false, x: 0, y: 0, dx: 1, dy: 0, a: 0 };
  function drawTop() {
    const c = tctx;
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.clearRect(0, 0, W, H);
    for (const p of petals) if (p.landed) drawPetal(c, p);
    for (const st of stones) c.drawImage(st.cv, st.x - st.R, st.y - st.R, st.R * 2, st.R * 2);
    if (rakeVis.a > 0.01) {
      const { x, y, dx, dy } = rakeVis, nx = -dy, ny = dx, R = tines * SP / 2 + 3;
      c.save(); c.globalAlpha = rakeVis.a * 0.9;
      // handle
      const hg = c.createLinearGradient(x, y, x + dx * 150, y + dy * 150);
      hg.addColorStop(0, "rgba(104, 74, 46, .9)"); hg.addColorStop(1, "rgba(104, 74, 46, 0)");
      c.strokeStyle = hg; c.lineWidth = 4.5; c.lineCap = "round";
      c.beginPath(); c.moveTo(x + dx * 3, y + dy * 3); c.lineTo(x + dx * 150, y + dy * 150); c.stroke();
      // head
      c.strokeStyle = "rgba(60, 40, 22, .35)"; c.lineWidth = 6;
      c.beginPath(); c.moveTo(x - nx * R + 2, y - ny * R + 3); c.lineTo(x + nx * R + 2, y + ny * R + 3); c.stroke();
      c.strokeStyle = "#7a5634"; c.lineWidth = 5;
      c.beginPath(); c.moveTo(x - nx * R, y - ny * R); c.lineTo(x + nx * R, y + ny * R); c.stroke();
      c.strokeStyle = "rgba(255, 230, 190, .35)"; c.lineWidth = 1.2;
      c.beginPath(); c.moveTo(x - nx * R - dx * 1.5, y - ny * R - dy * 1.5); c.lineTo(x + nx * R - dx * 1.5, y + ny * R - dy * 1.5); c.stroke();
      c.restore();
    }
    for (const p of petals) if (!p.landed) drawPetal(c, p);
  }

  // ---------- Audio ----------
  let ac = null, master, rake = {}, audI = 0, audTarget = 0, lastMoveT = 0, bellTimer = 0;

  function noiseBuffers() {
    const sr = ac.sampleRate, len = sr * 2;
    const white = ac.createBuffer(1, len, sr), wd = white.getChannelData(0);
    for (let i = 0; i < len; i++) wd[i] = Math.random() * 2 - 1;
    const brown = ac.createBuffer(1, len, sr), bd = brown.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; bd[i] = last * 3.5; }
    const grains = ac.createBuffer(1, len, sr), gd = grains.getChannelData(0);
    let i = 0;
    while (i < len) {
      i += Math.max(1, Math.floor(-Math.log(1 - Math.random()) * sr / 1100));
      const amp = Math.pow(Math.random(), 2.2) * 0.9 + 0.08, dur = 12 + (Math.random() * 70) | 0;
      for (let k = 0; k < dur && i + k < len; k++) gd[i + k] += (Math.random() * 2 - 1) * amp * Math.exp(-k / (dur * 0.28));
    }
    return { white, brown, grains };
  }

  function loopSrc(buf, rate) {
    const s = ac.createBufferSource(); s.buffer = buf; s.loop = true;
    if (rate) s.playbackRate.value = rate;
    s.start(0, Math.random() * buf.duration);
    return s;
  }

  function initAudio() {
    if (ac) { if (ac.state === "suspended") ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = soundOn ? 1 : 0; master.connect(ac.destination);
    const b = noiseBuffers();
    rake.bufs = b;

    // Raking: soft hiss + grain crackle + low scrape, driven by stroke speed
    rake.pan = ac.createStereoPanner ? ac.createStereoPanner() : ac.createGain();
    rake.pan.connect(master);
    const hiss = loopSrc(b.white);
    rake.bp = ac.createBiquadFilter(); rake.bp.type = "bandpass"; rake.bp.frequency.value = 2200; rake.bp.Q.value = 0.7;
    rake.hissG = ac.createGain(); rake.hissG.gain.value = 0;
    hiss.connect(rake.bp).connect(rake.hissG).connect(rake.pan);
    rake.grainSrc = loopSrc(b.grains);
    const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1100;
    const pk = ac.createBiquadFilter(); pk.type = "peaking"; pk.frequency.value = 3800; pk.gain.value = 4; pk.Q.value = 0.8;
    rake.grainG = ac.createGain(); rake.grainG.gain.value = 0;
    rake.grainSrc.connect(hp).connect(pk).connect(rake.grainG).connect(rake.pan);
    const low = loopSrc(b.brown);
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 520;
    rake.lowG = ac.createGain(); rake.lowG.gain.value = 0;
    low.connect(lp).connect(rake.lowG).connect(rake.pan);

    // Ambient wind
    const wind = loopSrc(b.brown, 0.8);
    const wlp = ac.createBiquadFilter(); wlp.type = "lowpass"; wlp.frequency.value = 380;
    const wg = ac.createGain(); wg.gain.value = 0.045;
    const lfo = ac.createOscillator(); lfo.frequency.value = 0.045;
    const lfoG = ac.createGain(); lfoG.gain.value = 0.03;
    lfo.connect(lfoG).connect(wg.gain); lfo.start();
    wind.connect(wlp).connect(wg).connect(master);
    const air = loopSrc(b.white, 0.5);
    const abp = ac.createBiquadFilter(); abp.type = "bandpass"; abp.frequency.value = 900; abp.Q.value = 0.5;
    const ag = ac.createGain(); ag.gain.value = 0.004;
    const lfo2 = ac.createOscillator(); lfo2.frequency.value = 0.07;
    const lfo2G = ac.createGain(); lfo2G.gain.value = 0.0035;
    lfo2.connect(lfo2G).connect(ag.gain); lfo2.start();
    air.connect(abp).connect(ag).connect(master);

    scheduleBell(6000 + Math.random() * 6000);
  }

  function scheduleBell(ms) {
    clearTimeout(bellTimer);
    bellTimer = setTimeout(() => { if (soundOn && !document.hidden) bell(); scheduleBell(22000 + Math.random() * 26000); }, ms);
  }

  function bell() {
    if (!ac) return;
    const t = ac.currentTime + 0.05;
    const base = [196, 220, 246.9, 293.7][(Math.random() * 4) | 0];
    const out = ac.createGain(); out.gain.value = 0.06;
    let node = out;
    if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = Math.random() * 1.2 - 0.6; out.connect(p); node = p; }
    node.connect(master);
    const parts = [[1, 1, 9], [1.004, 0.5, 9], [2.01, 0.32, 6], [2.76, 0.22, 4.5], [4.07, 0.1, 3], [5.43, 0.05, 2]];
    for (const [r, a, d] of parts) {
      const o = ac.createOscillator(); o.frequency.value = base * r;
      const g = ac.createGain();
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(a, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g).connect(out); o.start(t); o.stop(t + d + 0.1);
    }
  }

  function thud(vol, x) {
    if (!ac || !soundOn) return;
    const t = ac.currentTime;
    const out = ac.createGain(); out.gain.value = vol;
    let node = out;
    if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = clamp((x / W) * 2 - 1, -1, 1) * 0.5; out.connect(p); node = p; }
    node.connect(master);
    const o = ac.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(46, t + 0.2);
    const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.55, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    o.connect(g).connect(out); o.start(t); o.stop(t + 0.55);
    const n = ac.createBufferSource(); n.buffer = rake.bufs.grains; n.playbackRate.value = 0.8;
    const nf = ac.createBiquadFilter(); nf.type = "bandpass"; nf.frequency.value = 2400; nf.Q.value = 0.6;
    const ng = ac.createGain(); ng.gain.setValueAtTime(0.7, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    n.connect(nf).connect(ng).connect(out); n.start(t, Math.random()); n.stop(t + 0.4);
    const b = ac.createBufferSource(); b.buffer = rake.bufs.brown;
    const bf = ac.createBiquadFilter(); bf.type = "lowpass"; bf.frequency.value = 700;
    const bg = ac.createGain(); bg.gain.setValueAtTime(0.5, t); bg.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    b.connect(bf).connect(bg).connect(out); b.start(t, Math.random()); b.stop(t + 0.3);
  }

  function updateAudio(now) {
    if (!ac) return;
    if (now - lastMoveT > 90 && !(ptr && tool === "ripple")) audTarget = 0;
    audI += (audTarget - audI) * (audTarget > audI ? 0.35 : 0.12);
    const I = audI, t = ac.currentTime, tc = 0.04;
    const soft = tool === "smooth" ? 0.6 : 1;
    rake.hissG.gain.setTargetAtTime(0.085 * I * soft, t, tc);
    rake.grainG.gain.setTargetAtTime(0.6 * I * (tool === "smooth" ? 0.35 : 1), t, tc);
    rake.lowG.gain.setTargetAtTime(0.42 * I, t, tc);
    rake.bp.frequency.setTargetAtTime((tool === "smooth" ? 1100 : 1500) + 1700 * I + tines * 40, t, 0.08);
    rake.grainSrc.playbackRate.setTargetAtTime(0.7 + 0.55 * I, t, 0.08);
    if (rake.pan.pan && ptr) rake.pan.pan.setTargetAtTime(clamp((ptr.x / W) * 2 - 1, -1, 1) * 0.55, t, 0.1);
  }

  function feedSpeed(dist, dt) {
    const v = dist / Math.max(dt, 4);
    const k = tool === "rake" ? 0.55 + tines * 0.06 : 0.8;
    audTarget = Math.pow(clamp(v / 1.3, 0, 1), 0.6) * k;
    lastMoveT = performance.now();
  }

  function setSound(on) {
    soundOn = on;
    const btn = document.getElementById("t-sound");
    btn.setAttribute("aria-pressed", on);
    btn.querySelector(".w").style.display = on ? "" : "none";
    btn.querySelector(".x").style.display = on ? "none" : "";
    if (ac) master.gain.setTargetAtTime(on ? 1 : 0, ac.currentTime, 0.15);
  }

  // ---------- Pointer input ----------
  let ptr = null;
  function pos(e) { const r = garden.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

  garden.addEventListener("pointerdown", e => {
    if (ptr || (e.pointerType === "mouse" && e.button !== 0)) return;
    initAudio();
    const p = pos(e);
    try { garden.setPointerCapture(e.pointerId); } catch (_) {}
    ptr = { id: e.pointerId, x: p.x, y: p.y, sx: p.x, sy: p.y, t: e.timeStamp, dx: 1, dy: 0, has: false, moved: false };
    if (tool === "ripple") { ptr.r = 6; ptr.rPrev = 0; rippleStamp(p.x, p.y, 0, ptr.r); audTarget = 0.35; }
    else if (tool === "stone") {
      const st = hitStone(p.x, p.y);
      if (st) { ptr.stone = st; ptr.ox = st.x - p.x; ptr.oy = st.y - p.y; }
      else { addStone(p.x, p.y); thud(0.9, p.x); }
    } else if (tool === "smooth") smoothStamp(p.x, p.y);
  });

  function moveTo(p, ts) {
    const ddx = p.x - ptr.x, ddy = p.y - ptr.y, dist = Math.hypot(ddx, ddy);
    if (tool === "stone") {
      const st = ptr.stone;
      if (!st) return;
      if (!ptr.moved && Math.hypot(p.x - ptr.sx, p.y - ptr.sy) > 5) {
        ptr.moved = true;
        liftStone(st);
        stones.splice(stones.indexOf(st), 1); stones.push(st);
        rebuildMask();
      }
      if (ptr.moved) { st.x = clamp(p.x + ptr.ox, 0, W); st.y = clamp(p.y + ptr.oy, 0, H); }
      ptr.x = p.x; ptr.y = p.y;
      return;
    }
    if (tool === "ripple") return;
    if (tool === "rake" && !ptr.has) {
      const d0 = Math.hypot(p.x - ptr.x, p.y - ptr.y);
      if (d0 < 4) return;
      ptr.dx = (p.x - ptr.x) / d0; ptr.dy = (p.y - ptr.y) / d0; ptr.has = true;
    }
    if (dist < 0.5) return;
    feedSpeed(dist, ts - ptr.t);
    ptr.t = ts;
    const sx = ddx / dist, sy = ddy / dist;
    let ndx = ptr.dx * 0.6 + sx * 0.4, ndy = ptr.dy * 0.6 + sy * 0.4;
    const nl = Math.hypot(ndx, ndy) || 1; ndx /= nl; ndy /= nl;
    const steps = Math.max(1, Math.ceil(dist / 2)), len = dist / steps;
    for (let k = 1; k <= steps; k++) {
      const f = k / steps, cx = ptr.x + ddx * f, cy = ptr.y + ddy * f;
      const dx = ptr.dx + (ndx - ptr.dx) * f, dy = ptr.dy + (ndy - ptr.dy) * f, l = Math.hypot(dx, dy) || 1;
      if (tool === "rake") rakeStamp(cx, cy, dx / l, dy / l, len);
      else smoothStamp(cx, cy);
    }
    ptr.dx = ndx; ptr.dy = ndy; ptr.x = p.x; ptr.y = p.y;
    if (tool === "rake") { rakeVis.x = p.x; rakeVis.y = p.y; rakeVis.dx = ndx; rakeVis.dy = ndy; rakeVis.on = true; }
  }

  garden.addEventListener("pointermove", e => {
    if (!ptr || e.pointerId !== ptr.id) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) moveTo(pos(ev), ev.timeStamp);
  });

  function endPointer(e) {
    if (!ptr || e.pointerId !== ptr.id) return;
    if (tool === "stone" && ptr.stone) {
      const st = ptr.stone;
      if (ptr.moved) { rebuildMask(); stoneRings(st); thud(0.7, st.x); }
      else { liftStone(st); stones.splice(stones.indexOf(st), 1); rebuildMask(); thud(0.35, st.x); }
    }
    ptr = null; rakeVis.on = false; audTarget = 0;
  }
  garden.addEventListener("pointerup", endPointer);
  garden.addEventListener("pointercancel", endPointer);

  // ---------- Toolbar ----------
  const HINTS = {
    rake: "Arrastra para rastrillar la arena",
    ripple: "Mantén pulsado para dibujar ondas",
    stone: "Toca para colocar una piedra. Arrástrala para moverla o tócala para quitarla",
    smooth: "Pasa el dedo para alisar la arena",
  };
  const tinesEl = document.getElementById("tines");
  function setTool(t) {
    tool = t;
    document.querySelectorAll(".tool[data-tool]").forEach(b => b.setAttribute("aria-pressed", b.dataset.tool === t));
    tinesEl.classList.toggle("off", t !== "rake");
    hintEl.textContent = HINTS[t];
    garden.style.cursor = t === "stone" ? "pointer" : "crosshair";
  }
  document.querySelectorAll(".tool[data-tool]").forEach(b => b.addEventListener("click", () => { initAudio(); setTool(b.dataset.tool); }));
  document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
    tines = +b.dataset.tines;
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
  }));
  document.getElementById("t-sound").addEventListener("click", () => { initAudio(); setSound(!soundOn); });

  let clearing = 0;
  document.getElementById("t-clear").addEventListener("click", () => {
    initAudio();
    clearing = 34;
    audTarget = 0.7; lastMoveT = performance.now() + 500;
  });

  window.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const map = { "1": "rake", "2": "ripple", "3": "stone", "4": "smooth" };
    if (map[e.key]) setTool(map[e.key]);
    else if (e.key === "s" || e.key === "S") { initAudio(); setSound(!soundOn); }
  });

  document.addEventListener("visibilitychange", () => {
    if (!ac) return;
    document.hidden ? ac.suspend() : ac.resume();
  });

  let rt = 0;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => setup(true), 160); });

  // ---------- Main loop ----------
  let lastT = performance.now();
  function frame(now) {
    const dt = Math.min(50, now - lastT); lastT = now;

    if (ptr && tool === "ripple") {
      const maxR = clamp(Math.min(W, H) * 0.42, 90, 300);
      if (ptr.r < maxR) {
        ptr.rPrev = ptr.r;
        ptr.r = Math.min(maxR, ptr.r + dt * 0.075);
        rippleStamp(ptr.sx, ptr.sy, ptr.rPrev, ptr.r);
        audTarget = 0.3 + 0.25 * Math.sin(now / 260) ** 2;
      } else audTarget = 0;
    }

    if (clearing > 0) {
      clearing--;
      const f = clearing === 0 ? 0 : 0.86;
      for (let i = 0; i < hgt.length; i++) if (!mask[i]) hgt[i] *= f;
      markDirty(0, 0, W, H);
    }

    rakeVis.a += ((rakeVis.on ? 1 : 0) - rakeVis.a) * 0.2;

    if (!reduceMotion) {
      nextPetal -= dt;
      if (nextPetal <= 0 && petals.length < 7) { spawnPetal(); nextPetal = 3500 + Math.random() * 6000; }
      for (let k = petals.length - 1; k >= 0; k--) {
        const p = petals[k];
        p.life += dt;
        if (!p.landed) {
          p.ph += dt * 0.004;
          p.x += (p.vx + Math.sin(p.ph * 0.7) * 0.012) * dt;
          p.y += (p.vy + Math.cos(p.ph) * 0.006) * dt;
          p.rot += p.vr * dt;
          p.alpha = Math.min(1, p.life / 800) * 0.92;
          if (p.y > H * p.land || p.x > W * 0.95) { p.landed = true; p.ph = 0.3; p.rest = 0; }
          if (p.x > W + 30 || p.y > H + 30) petals.splice(k, 1);
        } else {
          p.rest += dt;
          p.alpha = 0.85 * (1 - smooth(9000, 14000, p.rest));
          if (p.rest > 14000) petals.splice(k, 1);
        }
      }
    }

    flush();
    drawTop();
    updateAudio(now);
    requestAnimationFrame(frame);
  }

  // ---------- First garden: raked lines with a sanzon stone group ----------
  setup(false);
  {
    const base = clamp(Math.min(W, H) * 0.08, 28, 70);
    const portrait = H > W;
    const group = portrait
      ? [[0.62, 0.40, 1.0], [0.78, 0.48, 0.58], [0.30, 0.66, 0.72]]
      : [[0.64, 0.44, 1.0], [0.73, 0.56, 0.58], [0.28, 0.62, 0.74]];
    for (const [fx, fy, k] of group) addStone(W * fx, H * fy, base * k);
  }
  requestAnimationFrame(frame);
})();
</script>
