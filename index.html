<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jardín Karesansui</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Un jardín zen japonés interactivo: rastrilla la arena, dibuja ondas y coloca piedras, con sonido de arena.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
/* Layout: full-bleed raked-sand canvas under drifting cloud and leaf shadows; quiet ink title top-left; charcoal tool tray floating at the bottom */
:root {
  --sand: #d8d1c1;
  --ink: #2e2c28;
  --ink-soft: rgba(46, 44, 40, .66);
  --tray: rgba(40, 30, 22, .58);
  --tray-fg: #f1ebde;
  --tray-dim: #bcb5a6;
  --moss: #9aad6e;
  --font-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--sand);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#garden { position: fixed; inset: 0; touch-action: none; cursor: crosshair; }
#garden canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.fx { position: fixed; pointer-events: none; }
#clouds { left: -40vw; top: -40vh; width: 180vw; height: 180vh; will-change: transform; }
#leaves { top: -6vmin; right: -8vmin; width: 62vmin; height: 62vmin; mix-blend-mode: multiply; opacity: .3; transform-origin: 85% 10%; will-change: transform; }
#warm { inset: 0; background: rgb(255, 176, 96); mix-blend-mode: soft-light; opacity: .05; }
#sun { inset: 0; background: radial-gradient(ellipse 90% 70% at 18% 8%, rgba(255, 240, 214, .55), rgba(255, 240, 214, 0) 70%), radial-gradient(ellipse 80% 70% at 92% 96%, rgba(70, 52, 30, .35), rgba(70, 52, 30, 0) 70%); mix-blend-mode: soft-light; }
#frame { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#probe { position: fixed; top: 0; left: 0; width: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); visibility: hidden; pointer-events: none; }
header, #dock { transition: opacity 2.4s ease; }
body.zen header, body.zen #dock { opacity: 0; }
body.zen #dock { pointer-events: none; }
body.zen #dock * { pointer-events: none; }
#vignette { inset: 0; background: radial-gradient(ellipse at 48% 46%, rgba(0,0,0,0) 52%, rgba(58,42,22,.20) 100%); }

header {
  position: fixed; top: 0; left: 0; right: 0;
  --inset: clamp(14px, 3vw, 34px);
  padding-top: calc(env(safe-area-inset-top, 0px) + var(--inset) + 18px);
  padding-left: calc(max(16px, env(safe-area-inset-left, 0px)) + var(--inset));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
  display: grid; gap: 6px;
}
h1 {
  margin: 0;
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(22px, 3.2vw, 30px); letter-spacing: .02em; line-height: 1.1;
  display: flex; align-items: baseline; gap: .45em;
  text-wrap: balance;
  text-shadow: 0 0 10px var(--sand);
}
h1 .kanji { font-weight: 500; letter-spacing: .12em; }
h1 .latin { font-size: .62em; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-soft); }
#hint {
  margin: 0; font-size: 14px; color: var(--ink-soft);
  max-width: 34ch; line-height: 1.45;
  text-shadow: 0 0 6px var(--sand), 0 0 2px var(--sand);
  transition: opacity .8s ease;
}

#dock {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  pointer-events: none;
}
#dock > * { transition: opacity .5s ease, transform .25s ease; }
#dock.drawing > * { opacity: .2; }
.tray {
  pointer-events: auto;
  background: var(--tray);
  -webkit-backdrop-filter: blur(10px) saturate(1.1); backdrop-filter: blur(10px) saturate(1.1);
  color: var(--tray-fg);
  border-radius: 18px;
  box-shadow: 0 6px 18px rgba(30, 18, 8, .22);
  display: flex; flex-wrap: wrap; justify-content: center; align-items: stretch;
  gap: 2px; padding: 6px; max-width: 100%;
}
.tray .sep { width: 1px; background: rgba(239,233,220,.16); margin: 8px 4px; }
.tool {
  appearance: none; border: 0; background: transparent; color: var(--tray-dim);
  font: 500 11.5px/1 var(--font-body); letter-spacing: .04em;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  min-width: 54px; min-height: 54px; padding: 8px 5px 7px; border-radius: 12px; cursor: pointer;
  transition: color .2s, background-color .2s;
  touch-action: manipulation;
}
.tool svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
.tool:hover { color: var(--tray-fg); }
.tool[aria-pressed="true"] { color: var(--tray-fg); background: rgba(239,233,220,.12); }
.tool[aria-pressed="true"] .dot { opacity: 1; }
.tool .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--moss); opacity: 0; margin-top: -2px; }
.tool:focus-visible, .chip:focus-visible { outline: 2px solid var(--moss); outline-offset: 1px; }
#t-new .ring { stroke: var(--moss); stroke-width: 2; stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0; transition: stroke-dashoffset .2s ease, opacity .2s; }
#t-new.holding .ring { stroke-dashoffset: 0; opacity: 1; transition: stroke-dashoffset .8s linear; }

.tines {
  pointer-events: auto;
  display: flex; align-items: center; gap: 4px;
  padding: 4px 5px 4px 14px; border-radius: 999px;
  background: var(--tray); color: var(--tray-dim);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  font-size: 12px; letter-spacing: .06em;
}
.tines.off { opacity: 0 !important; transform: translateY(6px); pointer-events: none; }
.tines span { margin-right: 4px; }
.chip {
  appearance: none; border: 0; cursor: pointer;
  background: transparent; color: var(--tray-dim);
  font: 500 13px/1 var(--font-body); font-variant-numeric: tabular-nums;
  min-width: 40px; height: 36px; border-radius: 999px;
  touch-action: manipulation;
}
.chip[aria-pressed="true"] { background: rgba(239,233,220,.16); color: var(--tray-fg); }

@media (max-width: 420px) {
  .tool { min-width: 50px; padding-inline: 3px; font-size: 10.5px; }
  .tray .sep { margin-inline: 1px; }
}
@media (prefers-reduced-motion: reduce) {
  #dock > *, #hint, .tool { transition: none; }
}
</style>
</head>
<body>

<div id="garden" aria-label="Jardín de arena. Arrastra para rastrillar." role="img">
  <canvas id="sand"></canvas>
  <canvas id="top"></canvas>
</div>
<canvas id="frame"></canvas>
<canvas id="clouds" class="fx" width="120" height="80"></canvas>
<canvas id="leaves" class="fx" width="420" height="420"></canvas>
<div id="warm" class="fx"></div>
<div id="sun" class="fx"></div>
<div id="vignette" class="fx"></div>
<div id="probe"></div>

<header>
  <h1><span class="kanji">枯山水</span><span class="latin">Karesansui</span></h1>
  <p id="hint">Arrastra para rastrillar la arena</p>
</header>

<div id="dock">
  <div class="tines" id="tines" role="group" aria-label="Púas del rastrillo">
    <span>Púas</span>
    <button class="chip" data-tines="3" aria-pressed="false">3</button>
    <button class="chip" data-tines="5" aria-pressed="true">5</button>
    <button class="chip" data-tines="8" aria-pressed="false">8</button>
  </div>
  <nav class="tray" aria-label="Herramientas">
    <button class="tool" data-tool="rake" aria-pressed="true" title="Rastrillo (1)">
      <svg viewBox="0 0 24 24"><path d="M12 2v11"/><path d="M4 13h16"/><path d="M5 13v5M9 13v6M12 13v6M15 13v6M19 13v5"/></svg>
      Rastrillo<i class="dot"></i>
    </button>
    <button class="tool" data-tool="ripple" aria-pressed="false" title="Ondas (2)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="9"/></svg>
      Ondas<i class="dot"></i>
    </button>
    <button class="tool" data-tool="stone" aria-pressed="false" title="Piedra (3)">
      <svg viewBox="0 0 24 24"><path d="M4.5 17l1.8-6.2 4.6-3.6 5.4.6 3.6 4.4.6 4.8z"/><path d="M3 20.5h18"/></svg>
      Piedra<i class="dot"></i>
    </button>
    <button class="tool" data-tool="smooth" aria-pressed="false" title="Alisar (4)">
      <svg viewBox="0 0 24 24"><path d="M3 15c3-2.5 6-2.5 9 0s6 2.5 9 0"/><path d="M3 9.5c3-1.5 6-1.5 9 0s6 1.5 9 0" opacity=".45"/></svg>
      Alisar<i class="dot"></i>
    </button>
    <i class="sep" aria-hidden="true"></i>
    <button class="tool" id="t-sound" aria-pressed="true" title="Sonido (S)">
      <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path class="w" d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.5 7.5 0 0 1 0 10.4"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5" style="display:none"/></svg>
      Sonido<i class="dot"></i>
    </button>
    <button class="tool" id="t-new" title="Mantén pulsado para rastrillar todo el jardín de nuevo">
      <svg viewBox="0 0 24 24"><circle class="ring" cx="12" cy="12" r="11" pathLength="100" transform="rotate(-90 12 12)"/><path d="M5 9h14M5 12h14M5 15h14" opacity=".9"/></svg>
      Nuevo<i class="dot"></i>
    </button>
  </nav>
</div>

<script>
(() => {
  "use strict";
  const garden = document.getElementById("garden");
  const sandCv = document.getElementById("sand"), sctx = sandCv.getContext("2d");
  const topCv = document.getElementById("top"), tctx = topCv.getContext("2d");
  const hintEl = document.getElementById("hint");
  const dock = document.getElementById("dock");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
  const smin = (a, b, k) => { const h = clamp(0.5 + 0.5 * (b - a) / k, 0, 1); return b + (a - b) * h - k * h * (1 - h); };
  const rand = (a, b) => a + Math.random() * (b - a);
  const haptic = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (_) {} };

  // ---------- Value noise ----------
  function hash(ix, iy, seed) {
    let h = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(seed, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  function vnoise(x, y, seed) {
    const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    const a = hash(ix, iy, seed), b = hash(ix + 1, iy, seed), c = hash(ix, iy + 1, seed), d = hash(ix + 1, iy + 1, seed);
    return (a + (b - a) * ux) * (1 - uy) + (c + (d - c) * ux) * uy;
  }
  function fbm(x, y, oct, seed) {
    let s = 0, amp = 0.5, norm = 0;
    for (let o = 0; o < oct; o++) { s += vnoise(x, y, seed + o * 17) * amp; norm += amp; x *= 2.03; y *= 2.03; amp *= 0.5; }
    return s / norm;
  }

  // ---------- Field state (all coordinates in sand cells; K cells per CSS px) ----------
  const GAP = 14;            // groove spacing in CSS px
  let K = 1, W = 0, H = 0, SP = GAP;
  let hgt, grain, mask, ao, baseMask, baseAo, img, pix;
  let G = { x0: 0, y0: 0, x1: 1, y1: 1 }; // the sand bed inside its border, in cells
  const frameCv = document.getElementById("frame"), fctx = frameCv.getContext("2d");
  let dirty = null;
  let tool = "rake", tines = 5, soundOn = true;
  const stones = [];
  const LX = -0.5, LY = -0.66, LZ = 0.56; // light from the top-left

  function markDirty(x0, y0, x1, y1) {
    x0 = Math.max(0, Math.floor(x0) - 1); y0 = Math.max(0, Math.floor(y0) - 1);
    x1 = Math.min(W, Math.ceil(x1) + 2); y1 = Math.min(H, Math.ceil(y1) + 2);
    if (x1 <= x0 || y1 <= y0) return;
    if (!dirty) dirty = { x0, y0, x1, y1 };
    else { dirty.x0 = Math.min(dirty.x0, x0); dirty.y0 = Math.min(dirty.y0, y0); dirty.x1 = Math.max(dirty.x1, x1); dirty.y1 = Math.max(dirty.y1, y1); }
  }

  function makeGrain(w, h) {
    const g = new Float32Array(w * h);
    const cs = 7 * K, inv = 1 / cs;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let v = (Math.random() * 2 - 1) * 0.028 + (vnoise(x * inv, y * inv, 5) - 0.5) * 0.04;
      const r = Math.random();
      if (r < 0.008) v -= 0.10; else if (r < 0.014) v += 0.06;
      g[y * w + x] = v;
    }
    return g;
  }

  function linePattern(x, y) {
    const cx = x / K, cy = y / K;
    const yy = cy + Math.sin(cx / 230) * 9 + Math.sin(cx / 91 + 1.3) * 2.2;
    return -Math.cos(TAU * yy / GAP);
  }

  function shadeRect(x0, y0, x1, y1) {
    const h = hgt, g = grain, o = ao, d = pix, w = W, gk = 0.13 * K;
    for (let y = y0; y < y1; y++) {
      const yr = y * w, ym = (y > 0 ? y - 1 : y) * w, yp = (y < H - 1 ? y + 1 : y) * w;
      for (let x = x0; x < x1; x++) {
        const i = yr + x;
        const dx = h[x < w - 1 ? i + 1 : i] - h[x > 0 ? i - 1 : i];
        const dy = h[yp + x] - h[ym + x];
        let s = (0.92 + (dx * 0.55 + dy * 0.8) * gk + h[i] * 0.02 + g[i]) * o[i];
        s = s < 0.45 ? 0.45 : s > 1.15 ? 1.15 : s;
        const j = i << 2;
        d[j] = 228 * s + (1 - s) * 6;
        d[j + 1] = 219 * s;
        d[j + 2] = 199 * s + (1 - s) * 18;
      }
    }
  }

  function flush() {
    if (!dirty) return;
    const { x0, y0, x1, y1 } = dirty;
    dirty = null;
    shadeRect(x0, y0, x1, y1);
    sctx.putImageData(img, 0, 0, x0, y0, x1 - x0, y1 - y0);
  }

  function setup(keep) {
    const cw = Math.max(1, garden.clientWidth), ch = Math.max(1, garden.clientHeight);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const oldK = K, old = hgt, ow = W, oh = H;
    K = Math.max(1, Math.min(dpr, Math.sqrt(3.0e6 / (cw * ch))));
    W = Math.round(cw * K); H = Math.round(ch * K); SP = GAP * K;
    const probe = getComputedStyle(document.getElementById("probe"));
    const safeT = parseFloat(probe.paddingTop) || 0, safeB = parseFloat(probe.paddingBottom) || 0;
    const side = clamp(cw * 0.03, 14, 34);
    G = { x0: Math.round(side * K), y0: Math.round((safeT + side) * K), x1: Math.round((cw - side) * K), y1: Math.round((ch - safeB - 108) * K) };
    const r = oldK / K;
    hgt = new Float32Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const ox = Math.round(x * r), oy = Math.round(y * r);
      hgt[y * W + x] = (keep && old && ox < ow && oy < oh) ? old[oy * ow + ox] : linePattern(x, y);
    }
    grain = makeGrain(W, H);
    mask = new Uint8Array(W * H);
    ao = new Float32Array(W * H);
    baseMask = new Uint8Array(W * H);
    baseAo = new Float32Array(W * H).fill(1);
    const edge = 7 * K;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x;
      if (x < G.x0 || x >= G.x1 || y < G.y0 || y >= G.y1) { baseMask[i] = 1; continue; }
      const dt = Math.min(x - G.x0, y - G.y0, G.x1 - 1 - x), db = G.y1 - 1 - y;
      baseAo[i] = Math.min(1 - 0.42 * Math.exp(-dt / edge), 1 - 0.25 * Math.exp(-db / (4 * K)));
    }
    sandCv.width = W; sandCv.height = H;
    frameCv.width = W; frameCv.height = H;
    topCv.width = W; topCv.height = H;
    img = sctx.createImageData(W, H); pix = img.data;
    for (let i = 3; i < pix.length; i += 4) pix[i] = 255;
    const sc = K / oldK;
    for (const s of stones) {
      if (keep && sc !== 1) { s.x *= sc; s.y *= sc; s.a *= sc; s.b *= sc; }
      s.x = clamp(s.x, 0, W); s.y = clamp(s.y, 0, H);
      renderStone(s);
    }
    rebuildMask();
    drawFrame();
    markDirty(0, 0, W, H);
  }

  // ---------- The garden's border: moss bank, curb stones, and the engawa we sit on ----------
  function drawFrame() {
    const im = fctx.createImageData(W, H), d = im.data, f = 1 / K;
    const plankH = 21 * K, beamH = 12 * K;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (x >= G.x0 && x < G.x1 && y >= G.y0 && y < G.y1) continue;
      const j = (y * W + x) * 4;
      let r, g, b;
      if (y >= G.y1) {
        const yy = y - G.y1;
        if (yy < beamH) {
          const t = yy / beamH, gr = fbm(x * f * 0.01, y * f * 0.5, 3, 41);
          const l = (t < 0.15 ? 1.25 : 1 - t * 0.25) * (0.85 + gr * 0.3);
          r = 92 * l; g = 64 * l; b = 42 * l;
        } else {
          const k = Math.floor((yy - beamH) / plankH), py = (yy - beamH) - k * plankH;
          const tone = 0.88 + hash(k, 3, 9) * 0.22;
          const gr = fbm(x * f * 0.006 + k * 13, py * f * 0.35 + k * 7, 4, 43);
          let l = tone * (0.8 + gr * 0.42) * (1 - 0.18 * (yy / (H - G.y1)));
          if (py < 1.2 * K) l *= 0.55; else if (py < 2.4 * K) l *= 1.08;
          const joint = Math.floor((x * f + hash(k, 1, 5) * 400) / 420);
          const jx = (x * f + hash(k, 1, 5) * 400) - joint * 420;
          if (jx < 1.2) l *= 0.6;
          r = 150 * l; g = 108 * l; b = 72 * l;
        }
      } else {
        const m = fbm(x * f * 0.07, y * f * 0.07, 4, 51), fine = vnoise(x * f * 0.6, y * f * 0.6, 53);
        const t = m * 0.75 + fine * 0.25, l = 0.7 + t * 0.6;
        r = (58 + 40 * t) * l; g = (70 + 44 * t) * l; b = (38 + 22 * t) * l;
      }
      d[j] = r; d[j + 1] = g; d[j + 2] = b; d[j + 3] = 255;
    }
    fctx.putImageData(im, 0, 0);
    // cut granite kerb between the moss and the sand
    const c = fctx, T = 10 * K;
    let k = 0;
    const run = (ax, ay, bx, by) => {
      const len = Math.hypot(bx - ax, by - ay), ux = (bx - ax) / len, uy = (by - ay) / len;
      c.save(); c.translate(ax, ay); c.rotate(Math.atan2(uy, ux));
      let s = -T / 2;
      while (s < len + T / 2) {
        const L = Math.min((34 + hash(k, 0, 3) * 46) * K, len + T / 2 - s), v = 0.88 + hash(k, 4, 3) * 0.2;
        c.shadowColor = "rgba(40, 30, 18, .35)"; c.shadowBlur = 5 * K; c.shadowOffsetX = 0; c.shadowOffsetY = 2 * K;
        const g = c.createLinearGradient(0, -T / 2, 0, T / 2);
        g.addColorStop(0, `rgb(${168 * v | 0},${164 * v | 0},${154 * v | 0})`);
        g.addColorStop(0.5, `rgb(${140 * v | 0},${136 * v | 0},${127 * v | 0})`);
        g.addColorStop(1, `rgb(${112 * v | 0},${108 * v | 0},${100 * v | 0})`);
        c.fillStyle = g; c.fillRect(s, -T / 2, L - 1.2 * K, T);
        c.shadowColor = "transparent";
        c.fillStyle = "rgba(255, 250, 240, .10)";
        for (let q = 0; q < L / K * 0.6; q++) c.fillRect(s + hash(k, q, 11) * (L - 2 * K), -T / 2 + hash(q, k, 13) * T, K, K);
        s += L; k++;
      }
      c.restore();
    };
    run(G.x0, G.y0, G.x1, G.y0);
    run(G.x0, G.y0, G.x0, G.y1);
    run(G.x1, G.y0, G.x1, G.y1);
  }

  // ---------- Sand tools ----------
  function rakeStamp(cx, cy, dx, dy, len, n) {
    const nx = -dy, ny = dx, s = SP, R = n * s / 2;
    const half = len / 2 + 1.6 * K, ext = R + s, off = n % 2 === 0 ? 0.5 : 0;
    const x0 = Math.max(0, (cx - ext) | 0), x1 = Math.min(W, (cx + ext + 1) | 0);
    const y0 = Math.max(0, (cy - ext) | 0), y1 = Math.min(H, (cy + ext + 1) | 0);
    const inner = R - s * 0.5, outer = R + s * 0.6;
    for (let y = y0; y < y1; y++) {
      const py = y - cy;
      for (let x = x0; x < x1; x++) {
        const px = x - cx, v = px * dx + py * dy;
        if (v > half || v < -half) continue;
        const u = px * nx + py * ny, au = u < 0 ? -u : u;
        if (au > outer) continue;
        const i = y * W + x;
        if (mask[i]) continue;
        const pat = -Math.cos(TAU * (u / s + off));
        const w = au <= inner ? 0.7 : 0.7 * (1 - smooth(inner, outer, au));
        hgt[i] += (pat - hgt[i]) * w;
      }
    }
    markDirty(x0, y0, x1, y1);
  }

  // A small ridge of pushed sand where the rake lifts off
  function moundStamp(cx, cy, dx, dy, n) {
    const nx = -dy, ny = dx, R = n * SP / 2, ext = R + SP;
    const x0 = Math.max(0, (cx - ext) | 0), x1 = Math.min(W, (cx + ext + 1) | 0);
    const y0 = Math.max(0, (cy - ext) | 0), y1 = Math.min(H, (cy + ext + 1) | 0);
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
      const px = x - cx, py = y - cy, v = px * dx + py * dy, u = Math.abs(px * nx + py * ny);
      const i = y * W + x;
      if (mask[i] || v < -2 * K || v > 7 * K) continue;
      const t = (v - 2.5 * K) / (2.2 * K);
      hgt[i] += 0.7 * Math.exp(-t * t) * (1 - smooth(R - SP * 0.5, R + SP * 0.4, u));
    }
    markDirty(x0, y0, x1, y1);
  }

  function rippleStamp(cx, cy, r0, r1) {
    const s = SP, ext = r1 + s;
    const x0 = Math.max(0, (cx - ext) | 0), x1 = Math.min(W, (cx + ext + 1) | 0);
    const y0 = Math.max(0, (cy - ext) | 0), y1 = Math.min(H, (cy + ext + 1) | 0);
    const inMin = Math.max(0, r0 - s * 1.5), outer = r1 + s * 0.5, edge = r1 - s * 0.6;
    for (let y = y0; y < y1; y++) {
      const py = y - cy;
      for (let x = x0; x < x1; x++) {
        const px = x - cx, d = Math.sqrt(px * px + py * py);
        if (d > outer || d < inMin) continue;
        const i = y * W + x;
        if (mask[i]) continue;
        const pat = -Math.cos(TAU * d / s);
        hgt[i] += (pat - hgt[i]) * (1 - smooth(edge, outer, d));
      }
    }
    markDirty(x0, y0, x1, y1);
  }

  function smoothStamp(cx, cy) {
    const R = 28 * K;
    const x0 = Math.max(0, (cx - R) | 0), x1 = Math.min(W, (cx + R + 1) | 0);
    const y0 = Math.max(0, (cy - R) | 0), y1 = Math.min(H, (cy + R + 1) | 0);
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
      const px = x - cx, py = y - cy, d = Math.sqrt(px * px + py * py);
      if (d > R) continue;
      const i = y * W + x;
      if (mask[i]) continue;
      hgt[i] *= 1 - 0.3 * (1 - smooth(R * 0.45, R, d));
    }
    markDirty(x0, y0, x1, y1);
  }

  // ---------- Stones ----------
  // Pale, polished river stones
  const TONES = [
    [192, 191, 187],
    [182, 182, 179],
    [200, 197, 190],
    [174, 175, 174],
  ];

  function makeStone(x, y, r) {
    const asp = rand(1.0, 1.28);
    const planes = [];
    const np = 3 + ((Math.random() * 3) | 0);
    for (let k = 0; k < np; k++) {
      const a = Math.random() * TAU;
      planes.push({ ux: Math.cos(a), uy: Math.sin(a), c: rand(0.55, 0.92), k: rand(0.45, 0.8) });
    }
    return {
      x, y, a: r * asp, b: r / Math.sqrt(asp), rot: Math.random() * Math.PI,
      ph: [Math.random() * TAU, Math.random() * TAU, Math.random() * TAU, Math.random() * TAU],
      tone: TONES[(Math.random() * TONES.length) | 0], planes,
      moss: false, seed: (Math.random() * 1e6) | 0,
      body: null, shadow: null, R: 0, lift: 0, bounce: 0,
    };
  }

  function stoneRho(st, t) {
    return 1 + 0.035 * Math.sin(2 * t + st.ph[0]) + 0.015 * Math.sin(3 * t + st.ph[1]);
  }
  // Normalised distance: < 1 inside the outline, 1 on it.
  function stoneN(st, x, y) {
    const px = x - st.x, py = y - st.y, cr = Math.cos(st.rot), sr = Math.sin(st.rot);
    const ex = (px * cr + py * sr) / st.a, ey = (-px * sr + py * cr) / st.b;
    return Math.sqrt(ex * ex + ey * ey) / stoneRho(st, Math.atan2(ey, ex));
  }
  function stonePath(c, st, ox, oy) {
    c.beginPath();
    const cr = Math.cos(st.rot), sr = Math.sin(st.rot);
    for (let k = 0; k <= 96; k++) {
      const t = k / 96 * TAU, rho = stoneRho(st, t);
      const lx = Math.cos(t) * st.a * rho, ly = Math.sin(t) * st.b * rho;
      const X = ox + lx * cr - ly * sr, Y = oy + lx * sr + ly * cr;
      k ? c.lineTo(X, Y) : c.moveTo(X, Y);
    }
    c.closePath();
  }

  function renderStone(st) {
    const m = Math.max(st.a, st.b), rAvg = (st.a + st.b) / 2;
    const R = Math.ceil(m * 1.32 + 18 * K), S = 2 * R;
    st.R = R;
    const seed = st.seed, f = 1 / K;
    const cr = Math.cos(st.rot), sr = Math.sin(st.rot);
    const N = S * S, hb = new Float32Array(N), nn = new Float32Array(N);
    // 1) height of a carved stone: shouldered dome cut by a few flat faces, with fine pitting
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      const px = x + 0.5 - R, py = y + 0.5 - R;
      const ex = (px * cr + py * sr) / st.a, ey = (-px * sr + py * cr) / st.b;
      const n = Math.sqrt(ex * ex + ey * ey) / stoneRho(st, Math.atan2(ey, ex));
      const i = y * S + x;
      nn[i] = n;
      if (n > 1.03) continue;
      const h = Math.pow(Math.max(0, 1 - n * n), 0.6);
      hb[i] = h * m * 0.55;
    }
    const body = document.createElement("canvas"); body.width = body.height = S;
    const bc = body.getContext("2d"), id = bc.createImageData(S, S), d = id.data;
    const [tr, tg, tb] = st.tone;
    const hx = LX, hy = LY, hz = LZ + 1, hl = Math.hypot(hx, hy, hz);
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      const i = y * S + x, n = nn[i];
      let alpha = 0, r = 0, g = 0, b = 0, lightAmt = 0.85;
      if (n < 1.03) {
        const gx = (hb[x < S - 1 ? i + 1 : i] - hb[x > 0 ? i - 1 : i]) * 0.5;
        const gy = (hb[y < S - 1 ? i + S : i] - hb[y > 0 ? i - S : i]) * 0.5;
        const il = 1 / Math.hypot(gx, gy, 1);
        const Nx = -gx * il, Ny = -gy * il, Nz = il;
        const diff = Math.max(0, Nx * LX + Ny * LY + Nz * LZ);
        const spec = Math.pow(Math.max(0, (Nx * hx + Ny * hy + Nz * hz) / hl), 16) * 0.16;
        const tone = 1 + (fbm(x * f * 0.02, y * f * 0.02, 2, seed + 3) - 0.5) * 0.06;
        lightAmt = (0.52 + 0.6 * diff) * tone;
        r = tr * lightAmt + 255 * spec;
        g = tg * lightAmt + 255 * spec;
        b = tb * lightAmt + 255 * spec + 4;
        alpha = clamp((1 - n) * rAvg / (1.5 * K), 0, 1);
      }
      // moss cushions hugging the base
      if (st.moss && n > 0.68 && n < 1.16) {
        const patch = fbm(x * f * 0.028, y * f * 0.028, 2, seed + 11);
        const fine = fbm(x * f * 0.32, y * f * 0.32, 2, seed + 13);
        const t = patch * 0.72 + fine * 0.28;
        const thr = 0.53 + (n > 1 ? (n - 1) / 0.16 * 0.22 : 0) + (n < 0.82 ? (0.82 - n) / 0.14 * 0.3 : 0);
        const ma = smooth(thr, thr + 0.04, t);
        if (ma > 0) {
          const lit = (0.72 + (fine - 0.5) * 0.9) * (0.75 + 0.35 * Math.min(1, lightAmt)) * (0.82 + 0.18 * smooth(thr, thr + 0.12, t));
          const mr = (95 + 30 * fine) * lit, mg = (107 + 31 * fine) * lit, mb = (63 + 22 * fine) * lit;
          r = r * (1 - ma) + mr * ma; g = g * (1 - ma) + mg * ma; b = b * (1 - ma) + mb * ma;
          if (alpha < ma) { const a0 = alpha; alpha = ma; if (a0 === 0) { r = mr; g = mg; b = mb; } }
        }
      }
      const j = i << 2;
      d[j] = r; d[j + 1] = g; d[j + 2] = b; d[j + 3] = alpha * 255;
    }
    bc.putImageData(id, 0, 0);
    st.body = body;
    // directional shadow: the silhouette smeared away from the light, darker where it meets the stone
    const sh = document.createElement("canvas"); sh.width = sh.height = S;
    const sc = sh.getContext("2d");
    sc.fillStyle = "rgba(58, 50, 42, 0.08)";
    for (let k = 1; k <= 9; k++) { stonePath(sc, st, R + k * 1.15 * K, R + k * 1.45 * K); sc.fill(); }
    st.shadow = sh;
  }

  function rebuildMask() {
    mask.set(baseMask); ao.set(baseAo);
    for (const st of stones) {
      if (st.lifted) continue;
      const m = Math.max(st.a, st.b) * 1.15 + 26 * K, rAvg = (st.a + st.b) / 2, aoR = 5 * K;
      const x0 = Math.max(0, (st.x - m) | 0), x1 = Math.min(W, (st.x + m + 1) | 0);
      const y0 = Math.max(0, (st.y - m) | 0), y1 = Math.min(H, (st.y + m + 1) | 0);
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
        const n = stoneN(st, x, y), i = y * W + x;
        if (n < 0.97) mask[i] = 1;
        const de = Math.max(0, (n - 1) * rAvg);
        const v = 1 - 0.4 * Math.exp(-de / aoR);
        if (v < ao[i]) ao[i] = v;
      }
      markDirty(x0, y0, x1, y1);
    }
  }

  function stoneRings(st) {
    const s = SP, ring = 4 * s, rAvg = (st.a + st.b) / 2, rim = 0.15 * rAvg;
    const m = Math.max(st.a, st.b) * 1.15 + ring + s;
    const x0 = Math.max(0, (st.x - m) | 0), x1 = Math.min(W, (st.x + m + 1) | 0);
    const y0 = Math.max(0, (st.y - m) | 0), y1 = Math.min(H, (st.y + m + 1) | 0);
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
      const i = y * W + x;
      const de = (stoneN(st, x, y) - 1) * rAvg;
      if (de > ring) continue;
      if (de < 0) { if (mask[i]) hgt[i] = 0.6; continue; }
      if (mask[i]) continue;
      let pat = -Math.cos(TAU * (de - s * 0.5) / s);
      pat += 0.45 * (1 - smooth(0, rim, de));  // sand pushed up against the stone
      hgt[i] += (pat - hgt[i]) * (1 - smooth(ring - s, ring, de));
    }
    markDirty(x0, y0, x1, y1);
  }

  function liftStone(st) {
    const m = Math.max(st.a, st.b) * 1.2;
    const x0 = Math.max(0, (st.x - m) | 0), x1 = Math.min(W, (st.x + m + 1) | 0);
    const y0 = Math.max(0, (st.y - m) | 0), y1 = Math.min(H, (st.y + m + 1) | 0);
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
      const n = stoneN(st, x, y);
      if (n < 1.05) { const i = y * W + x, t = smooth(0.7, 1.05, n); hgt[i] = -0.3 * (1 - t) + hgt[i] * t * 0.5; }
    }
    markDirty(x0, y0, x1, y1);
  }

  function addStone(x, y, r) {
    const base = clamp(Math.min(W, H) / K * 0.075, 26, 66) * K;
    const st = makeStone(x, y, r || base * rand(0.55, 1));
    stones.push(st);
    renderStone(st);
    rebuildMask();
    stoneRings(st);
    st.bounce = 1;
    return st;
  }

  const handleLen = () => clamp(Math.min(W, H) / K * 0.3, 100, 160) * K;
  const inBed = (x, y) => x > G.x0 + 8 * K && x < G.x1 - 8 * K && y > G.y0 + 8 * K && y < G.y1 - 8 * K;
  function hitStone(x, y) {
    for (let k = stones.length - 1; k >= 0; k--) if (stoneN(stones[k], x, y) < 1.12) return stones[k];
    return null;
  }

  // ---------- Ambient visuals ----------
  const petals = [];
  let nextPetal = 9000;
  function spawnPetal() {
    const fromLeft = Math.random() < 0.7;
    petals.push({
      x: fromLeft ? -20 * K : Math.random() * W * 0.8, y: fromLeft ? Math.random() * H * 0.6 : -20 * K,
      vx: rand(0.016, 0.032) * K, vy: rand(0.010, 0.02) * K,
      rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 0.002,
      ph: Math.random() * TAU, size: rand(4.5, 7.5) * K, life: 0,
      land: rand(0.35, 0.95), tone: Math.random() < 0.5 ? "#f0c8cf" : "#f5dcdf",
    });
  }
  function drawPetal(c, p) {
    c.save();
    c.translate(p.x, p.y); c.rotate(p.rot);
    c.scale(1, 0.35 + 0.65 * Math.abs(Math.cos(p.ph)));
    const s = p.size;
    c.beginPath();
    c.moveTo(0, -s);
    c.bezierCurveTo(s * 0.9, -s * 0.6, s * 0.7, s * 0.7, 0, s);
    c.bezierCurveTo(-s * 0.7, s * 0.7, -s * 0.9, -s * 0.6, 0, -s);
    c.fillStyle = p.tone; c.globalAlpha = p.alpha; c.fill();
    c.restore();
  }

  const grains = [];
  function spawnGrains(x, y, dx, dy, R) {
    const nx = -dy, ny = dx;
    for (let k = 0; k < 2; k++) {
      const side = Math.random() < 0.5 ? -1 : 1, u = side * R * rand(0.2, 1.05);
      grains.push({
        x: x + nx * u, y: y + ny * u,
        vx: (dx * rand(0.01, 0.05) + nx * side * rand(0.01, 0.04)) * K,
        vy: (dy * rand(0.01, 0.05) + ny * side * rand(0.01, 0.04)) * K,
        life: 0, max: rand(220, 340), light: Math.random() < 0.5,
      });
    }
  }

  // Cloud shadows: low-res noise stretched across the screen, drifting slowly
  (function drawClouds() {
    const c = document.getElementById("clouds").getContext("2d");
    const im = c.createImageData(120, 80);
    for (let y = 0; y < 80; y++) for (let x = 0; x < 120; x++) {
      const v = fbm(x * 0.045, y * 0.045, 4, 77), a = smooth(0.46, 0.72, v) * 0.13, j = (y * 120 + x) * 4;
      im.data[j] = 66; im.data[j + 1] = 54; im.data[j + 2] = 40; im.data[j + 3] = a * 255;
    }
    c.putImageData(im, 0, 0);
  })();

  // Komorebi: soft shadows of a maple branch over one corner
  (function drawLeaves() {
    const c = document.getElementById("leaves").getContext("2d");
    const S = 420;
    c.strokeStyle = "rgba(92, 78, 60, .32)"; c.lineCap = "round";
    const twig = (x0, y0, x1, y1, w) => { c.lineWidth = w; c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo((x0 + x1) / 2 + 10, (y0 + y1) / 2 + 12, x1, y1); c.stroke(); };
    twig(S, 30, 170, 210, 9); twig(300, 95, 230, 330, 5); twig(240, 150, 90, 170, 4); twig(200, 185, 150, 300, 3.5);
    const leaf = (x, y, r) => {
      const g = c.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, "rgba(92, 78, 60, .30)"); g.addColorStop(0.6, "rgba(92, 78, 60, .18)"); g.addColorStop(1, "rgba(92, 78, 60, 0)");
      c.fillStyle = g;
      c.beginPath();
      for (let k = 0; k <= 10; k++) { const a = k / 10 * TAU, rr = (k % 2 ? 0.55 : 1) * r; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
      c.fill();
    };
    const pts = [[170, 210], [230, 330], [90, 170], [150, 300], [300, 95], [255, 230], [205, 120], [120, 240]];
    for (const [px, py] of pts) for (let k = 0; k < 9; k++) leaf(px + rand(-38, 38), py + rand(-38, 38), rand(14, 26));
  })();
  const cloudsEl = document.getElementById("clouds"), leavesEl = document.getElementById("leaves"), warmEl = document.getElementById("warm");

  // ---------- Overlay: stones, rake, grains, petals ----------
  const rakeVis = { on: false, ghost: false, x: 0, y: 0, dx: 1, dy: 0, hx: 0, hy: 0, a: 0, n: 5 };
  function drawTop(now) {
    const c = tctx;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, W, H);
    for (const p of petals) if (p.landed) drawPetal(c, p);
    for (const st of stones) {
      const l = st.lift, R = st.R;
      c.globalAlpha = 1 - 0.45 * l;
      const sx = l * 7 * K, sy = l * 9 * K;
      c.drawImage(st.shadow, st.x - R + sx, st.y - R + sy);
      c.globalAlpha = 1;
    }
    for (const st of stones) {
      const l = st.lift, R = st.R;
      const bounce = st.bounce > 0 ? -0.03 * Math.sin(Math.PI * (1 - st.bounce)) : 0;
      const sc = 1 + 0.05 * l + bounce;
      c.save();
      c.translate(st.x - l * 2 * K, st.y - l * 3 * K);
      c.scale(sc, sc);
      c.drawImage(st.body, -R, -R);
      c.restore();
    }
    if (rakeVis.a > 0.01) {
      const { x, y, dx, dy, hx, hy } = rakeVis, nx = -dy, ny = dx, R = rakeVis.n * SP / 2 + 3 * K;
      c.save(); c.globalAlpha = rakeVis.a * (rakeVis.ghost ? 0.5 : 0.92);
      c.lineCap = "round";
      c.strokeStyle = "rgba(50, 34, 18, .22)"; c.lineWidth = 5 * K;
      c.beginPath(); c.moveTo(x + 2 * K, y + 3 * K); c.lineTo(hx + 2 * K, hy + 3 * K); c.stroke();
      c.strokeStyle = "#8a6440"; c.lineWidth = 4 * K;
      c.beginPath(); c.moveTo(x + dx * 3 * K, y + dy * 3 * K); c.lineTo(hx, hy); c.stroke();
      c.strokeStyle = "rgba(255, 232, 196, .3)"; c.lineWidth = 1.2 * K;
      c.beginPath(); c.moveTo(x + dx * 3 * K - ny * K, y + dy * 3 * K + nx * K); c.lineTo(hx - ny * K, hy + nx * K); c.stroke();
      const gl = Math.min(16 * K, Math.hypot(hx - x, hy - y) * 0.3);
      c.strokeStyle = "#4a3320"; c.lineWidth = 5 * K;
      c.beginPath(); c.moveTo(hx - dx * gl, hy - dy * gl); c.lineTo(hx, hy); c.stroke();
      c.strokeStyle = "rgba(60, 40, 22, .3)"; c.lineWidth = 6 * K;
      c.beginPath(); c.moveTo(x - nx * R + 2 * K, y - ny * R + 3 * K); c.lineTo(x + nx * R + 2 * K, y + ny * R + 3 * K); c.stroke();
      c.strokeStyle = "#7a5634"; c.lineWidth = 5 * K;
      c.beginPath(); c.moveTo(x - nx * R, y - ny * R); c.lineTo(x + nx * R, y + ny * R); c.stroke();
      c.strokeStyle = "rgba(255, 230, 190, .35)"; c.lineWidth = 1.2 * K;
      c.beginPath(); c.moveTo(x - nx * R - dx * 1.5 * K, y - ny * R - dy * 1.5 * K); c.lineTo(x + nx * R - dx * 1.5 * K, y + ny * R - dy * 1.5 * K); c.stroke();
      c.restore();
    }
    for (const g of grains) {
      c.globalAlpha = 1 - g.life / g.max;
      c.fillStyle = g.light ? "#f2ecdf" : "#8d816d";
      c.fillRect(g.x, g.y, 1.2 * K, 1.2 * K);
    }
    c.globalAlpha = 1;
    for (const p of petals) if (!p.landed) drawPetal(c, p);
  }

  // ---------- Audio ----------
  let ac = null, A = {};
  let audI = 0, audTarget = 0, speedEMA = 0, lastMoveT = 0, nextGrainT = 0;
  let dropTimer = 0, rinTimer = 0;

  function buffers() {
    const sr = ac.sampleRate;
    const pink = ac.createBuffer(1, sr * 4, sr), pd = pink.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < pd.length; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.969 * b2 + w * 0.153852;
      b3 = 0.8665 * b3 + w * 0.3104856; b4 = 0.55 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.016898;
      pd[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11; b6 = w * 0.115926;
    }
    const brown = ac.createBuffer(1, sr * 4, sr), bd = brown.getChannelData(0);
    let last = 0;
    for (let i = 0; i < bd.length; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; bd[i] = last * 3.5; }

    const len = Math.floor(sr * 2.5), ir = ac.createBuffer(2, len, sr);
    const a = 1 - Math.exp(-TAU * 4000 / sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch); let y = 0;
      for (let i = 0; i < len; i++) { y += a * ((Math.random() * 2 - 1) - y); d[i] = y * Math.exp(-(i / sr) / 0.6); }
    }
    return { pink, brown, white, ir };
  }

  function loopSrc(buf, rate) {
    const s = ac.createBufferSource(); s.buffer = buf; s.loop = true;
    if (rate) s.playbackRate.value = rate;
    s.start(0, Math.random() * buf.duration);
    return s;
  }
  function filt(type, f, q) { const n = ac.createBiquadFilter(); n.type = type; n.frequency.value = f; if (q != null) n.Q.value = q; return n; }
  function gain(v) { const g = ac.createGain(); g.gain.value = v; return g; }
  function panner(p) {
    if (!ac.createStereoPanner) return gain(1);
    const n = ac.createStereoPanner(); n.pan.value = p; return n;
  }

  function initAudio() {
    if (ac) { if (ac.state === "suspended") ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    const B = A.buf = buffers();
    const t = ac.currentTime;

    // Master: dry + room reverb -> gentle compressor -> fade-in -> mute
    A.mute = gain(soundOn ? 1 : 0); A.mute.connect(ac.destination);
    A.out = gain(0); A.out.gain.setValueAtTime(0, t); A.out.gain.linearRampToValueAtTime(0.7, t + 3); A.out.connect(A.mute);
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 3; comp.knee.value = 10; comp.attack.value = 0.01; comp.release.value = 0.25;
    comp.connect(A.out);
    A.bus = gain(1);
    const dry = gain(0.8), conv = ac.createConvolver(), wet = gain(0.22);
    conv.buffer = B.ir;
    A.bus.connect(dry).connect(comp);
    A.bus.connect(conv); conv.connect(wet).connect(comp);
    A.send = gain(1); A.send.connect(conv);

    // Rake bed: pink noise in the gravel band, plus a soft low drag
    A.pan = panner(0); A.pan.connect(A.bus);
    A.bp = filt("bandpass", 850, 1.0);
    A.rakeG = gain(0);
    loopSrc(B.pink).connect(A.bp).connect(filt("lowpass", 3500)).connect(A.rakeG).connect(A.pan);
    A.lowG = gain(0);
    loopSrc(B.brown).connect(filt("lowpass", 250)).connect(A.lowG).connect(A.pan);

    // Wind: pink noise through a slowly wandering band
    const wbp = filt("bandpass", 400, 0.5), wg = gain(0.05);
    loopSrc(B.pink, 0.9).connect(wbp).connect(wg).connect(A.bus);
    const lfo = ac.createOscillator(); lfo.frequency.value = 0.03;
    const lf1 = gain(150), lf2 = gain(0.025);
    lfo.connect(lf1).connect(wbp.frequency); lfo.connect(lf2).connect(wg.gain); lfo.start();

    nextGrainT = ac.currentTime;
    A.padSend = gain(0.6); A.padSend.connect(A.send);
    schedulePad(1500);
    scheduleDrop(9000 + Math.random() * 8000);
    scheduleRin(45000 + Math.random() * 30000);
  }

  // One grain of sand: a few milliseconds of band-limited noise
  function sandGrain(t, amp, fLo, fHi, dest) {
    const s = ac.createBufferSource(); s.buffer = A.buf.white;
    const dur = rand(0.003, 0.015);
    const bp = filt("bandpass", rand(fLo, fHi), 2);
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp, t + 0.001);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bp).connect(g).connect(dest || A.pan);
    s.start(t, Math.random() * 0.9, dur + 0.01);
  }

  function updateAudio(now, dt) {
    if (!ac) return;
    const busy = (ptr && tool === "ripple" && ptr.growing) || sweep;
    if (now - lastMoveT > 200 && !busy) { audTarget = 0; speedEMA *= 0.9; }
    const rising = audTarget > audI;
    audI += (audTarget - audI) * Math.min(1, dt / (rising ? 80 : 250));
    const t = ac.currentTime, I = audI, smoothing = tool === "smooth";
    A.rakeG.gain.setTargetAtTime(2.8 * I * (smoothing ? 0.75 : 1), t, rising ? 0.08 : 0.25);
    A.lowG.gain.setTargetAtTime(0.15 * I, t, rising ? 0.08 : 0.25);
    A.bp.frequency.setTargetAtTime((smoothing ? 600 : 700) + 400 * I, t, 0.15);
    const px = sweep ? sweep.x : rk ? rk.x : ptr ? ptr.x : demo ? rakeVis.x : W / 2;
    if (A.pan.pan) A.pan.pan.setTargetAtTime(clamp((px / W) * 2 - 1, -1, 1) * 0.5, t, 0.15);
    // grains, scheduled 50 ms ahead
    const rate = I > 0.03 ? 20 + 100 * I : 0;
    if (nextGrainT < t) nextGrainT = t;
    while (rate && nextGrainT < t + 0.05) {
      const amp = rand(0.05, 0.15) * (0.6 + I) * 5;
      if (smoothing) sandGrain(nextGrainT, amp * 0.7, 700, 1400); else sandGrain(nextGrainT, amp, 1200, 2500);
      nextGrainT += -Math.log(1 - Math.random()) / rate;
    }
  }

  function feedSpeed(cssDist, dt) {
    const v = cssDist / Math.max(dt, 4);
    speedEMA += (v - speedEMA) * 0.15;
    const k = tool === "rake" ? 0.6 + tines * 0.05 : 0.75;
    audTarget = Math.pow(clamp(speedEMA / 1.2, 0, 1), 0.6) * k;
    lastMoveT = performance.now();
  }

  function stoneSound(vol, x, removing) {
    if (!ac) return;
    const t = ac.currentTime + 0.005, p = panner(clamp((x / W) * 2 - 1, -1, 1) * 0.5), out = gain(vol);
    out.connect(p).connect(A.bus);
    if (!removing) {
      const o = ac.createOscillator(); o.frequency.value = rand(220, 320);
      const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.35, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
      o.connect(g).connect(out); o.start(t); o.stop(t + 0.1);
    }
    const n = ac.createBufferSource(); n.buffer = A.buf.pink;
    const ng = ac.createGain(); ng.gain.setValueAtTime(removing ? 0.8 : 1.3, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    n.connect(filt("lowpass", 1500)).connect(ng).connect(out); n.start(t, Math.random() * 3); n.stop(t + 0.15);
    const count = removing ? 3 : 4 + ((Math.random() * 5) | 0);
    for (let k = 0; k < count; k++) sandGrain(t + 0.02 + Math.random() * 0.2, rand(0.15, 0.4), 1500, 3000, out);
  }

  function tick(x) {
    if (!ac) return;
    const p = panner(clamp((x / W) * 2 - 1, -1, 1) * 0.5); p.connect(A.bus);
    sandGrain(ac.currentTime + 0.005, 0.25, 1600, 2000, p);
  }

  // Suikinkutsu: a water drop falling into a buried jar
  function drop() {
    const t0 = ac.currentTime + 0.05, n = Math.random() < 0.5 ? 1 : 2 + ((Math.random() * 2) | 0);
    const p = panner(rand(-0.5, 0.5)); p.connect(A.bus);
    const toRev = gain(0.9); p.connect(toRev).connect(A.send);
    for (let k = 0; k < n; k++) {
      const t = t0 + k * rand(0.45, 1.2), f = rand(1200, 2000);
      const o = ac.createOscillator(); o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.85, t + 0.03);
      const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.06, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g).connect(p); o.start(t); o.stop(t + 0.2);
      for (const [r, a] of [[0.5, 0.012], [0.75, 0.008], [1.12, 0.005]]) {
        const ro = ac.createOscillator(); ro.frequency.value = f * r;
        const rg = ac.createGain(); rg.gain.setValueAtTime(0, t + 0.01); rg.gain.linearRampToValueAtTime(a, t + 0.02); rg.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
        ro.connect(rg).connect(p); ro.start(t + 0.01); ro.stop(t + 1.5);
      }
    }
  }

  // Rin: a small bowl struck softly, notes from one pentatonic scale
  function rin() {
    const t = ac.currentTime + 0.05;
    const f0 = [293.66, 349.23, 392.0, 440.0, 523.25][(Math.random() * 5) | 0];
    const lp = filt("lowpass", 3000), out = gain(0.03), p = panner(rand(-0.4, 0.4));
    lp.connect(out).connect(p).connect(A.bus);
    for (const [r, a, d] of [[1, 1, 8], [2.71, 0.4, 4], [5.15, 0.15, 2]]) {
      for (const det of [-0.7, 0.7]) {
        const o = ac.createOscillator(); o.frequency.value = f0 * r + det;
        const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(a, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
        o.connect(g).connect(lp); o.start(t); o.stop(t + d + 0.1);
      }
    }
  }
  let padTimer = 0;
  const PAD = [146.83, 174.61, 196.0, 220.0, 261.63, 293.66];
  function padNote() {
    const t = ac.currentTime + 0.1, f = PAD[(Math.random() * PAD.length) | 0], dur = rand(11, 17);
    const lp = filt("lowpass", 900), g = gain(0), p = panner(rand(-0.35, 0.35));
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.022, t + dur * 0.4); g.gain.linearRampToValueAtTime(0, t + dur);
    lp.connect(g); g.connect(p).connect(A.bus); g.connect(A.padSend);

  function scheduleRin(ms) { clearTimeout(rinTimer); rinTimer = setTimeout(() => { if (soundOn && !document.hidden) rin(); scheduleRin(rand(70000, 120000)); }, ms); }

  function setSound(on) {
    soundOn = on;
    const btn = document.getElementById("t-sound");
    btn.setAttribute("aria-pressed", on);
    btn.querySelector(".w").style.display = on ? "" : "none";
    btn.querySelector(".x").style.display = on ? "none" : "";
    if (ac) A.mute.gain.setTargetAtTime(on ? 1 : 0, ac.currentTime, 0.2);
  }

  // ---------- Strokes ----------
  function strokeTo(s, x, y, n, kind) {
    const ddx = x - s.x, ddy = y - s.y, dist = Math.hypot(ddx, ddy);
    if (dist < 0.5) return 0;
    const sx = ddx / dist, sy = ddy / dist;
    let ndx = s.dx * 0.6 + sx * 0.4, ndy = s.dy * 0.6 + sy * 0.4;
    const nl = Math.hypot(ndx, ndy) || 1; ndx /= nl; ndy /= nl;
    const steps = Math.max(1, Math.ceil(dist / (2 * K))), len = dist / steps;
    for (let k = 1; k <= steps; k++) {
      const f = k / steps, cx = s.x + ddx * f, cy = s.y + ddy * f;
      const dx = s.dx + (ndx - s.dx) * f, dy = s.dy + (ndy - s.dy) * f, l = Math.hypot(dx, dy) || 1;

    }

    return dist;
  }

  // ---------- Pointer input ----------
  let ptr = null, rk = null, demo = null, sweep = null, interacted = false;
  const usedTools = new Set();
  function pos(e) {
    const r = garden.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }

  garden.addEventListener("pointerdown", e => {
    if (ptr || (e.pointerType === "mouse" && e.button !== 0)) return;
    interacted = true;
    if (demo) { demo = null; rakeVis.on = false; rakeVis.ghost = false; }
    initAudio();
    const p = pos(e);
    try { garden.setPointerCapture(e.pointerId); } catch (_) {}
    ptr = { id: e.pointerId, x: p.x, y: p.y, sx: p.x, sy: p.y, t: e.timeStamp, dx: 1, dy: 0, has: false, moved: false, travel: 0 };
    dock.classList.add("drawing");
    if (tool === "rake") rk = { x: p.x, y: p.y, sx: p.x, sy: p.y, tx: p.x, ty: p.y, dx: 1, dy: 0, has: false, releasing: false, travel: 0, n: tines };
    if (tool === "ripple") { ptr.r = 6 * K; ptr.rPrev = 0; ptr.rings = 0; ptr.growing = true; rippleStamp(p.x, p.y, 0, ptr.r); }
    else if (tool === "stone") {
      const st = hitStone(p.x, p.y);
      if (st) { ptr.stone = st; ptr.ox = st.x - p.x; ptr.oy = st.y - p.y; }
      else if (inBed(p.x, p.y)) { addStone(p.x, p.y); stoneSound(1, p.x); haptic([8, 30, 4]); }
    } else if (tool === "smooth") smoothStamp(p.x, p.y);
  });

  function moveTo(p, ts) {
    if (tool === "stone") {
      const st = ptr.stone;
      if (!st) return;
      if (!ptr.moved && Math.hypot(p.x - ptr.sx, p.y - ptr.sy) > 5 * K) {
        ptr.moved = true; st.lifted = true;
        liftStone(st);
        stones.splice(stones.indexOf(st), 1); stones.push(st);
        rebuildMask();
        haptic(4);
      }
      if (ptr.moved) { st.x = clamp(p.x + ptr.ox, G.x0 + 10 * K, G.x1 - 10 * K); st.y = clamp(p.y + ptr.oy, G.y0 + 10 * K, G.y1 - 10 * K); }
      return;
    }
    if (tool === "ripple") return;
    if (tool === "rake") { if (rk) { rk.tx = p.x; rk.ty = p.y; } return; }
    if (tool === "rake" && !ptr.has) {
      const d0 = Math.hypot(p.x - ptr.x, p.y - ptr.y);
      if (d0 < 4 * K) return;
      ptr.dx = (p.x - ptr.x) / d0; ptr.dy = (p.y - ptr.y) / d0; ptr.has = true;
    }
    const t0 = ptr.t, dist = strokeTo(ptr, p.x, p.y, tines, tool);
    if (!dist) return;
    const css = dist / K, dt = ts - t0;
    ptr.t = ts;
    feedSpeed(css, dt);
    ptr.travel += css;
    if (ptr.travel > 40) { ptr.travel = 0; haptic(2); }
    if (tool === "rake") {
      Object.assign(rakeVis, { x: p.x, y: p.y, dx: ptr.dx, dy: ptr.dy, on: true, ghost: false, n: tines });
    }
  }

  garden.addEventListener("pointermove", e => {
    if (!ptr || e.pointerId !== ptr.id) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    for (const ev of (evs.length ? evs : [e])) moveTo(pos(ev), ev.timeStamp);
  });

  function endPointer(e) {
    if (!ptr || e.pointerId !== ptr.id) return;
    if (tool === "stone" && ptr.stone) {
      const st = ptr.stone;
      if (ptr.moved) { st.lifted = false; rebuildMask(); stoneRings(st); st.bounce = 1; stoneSound(0.8, st.x); haptic([6, 30, 3]); }
      else { st.lifted = true; liftStone(st); stones.splice(stones.indexOf(st), 1); rebuildMask(); stoneSound(0.5, st.x, true); haptic(4); }
    }
    if (rk) rk.releasing = true;
    if (!usedTools.has(tool)) { usedTools.add(tool); hintEl.style.opacity = 0; }
    ptr = null;
    if (!rk) rakeVis.on = false;
    dock.classList.remove("drawing");
  }
  garden.addEventListener("pointerup", endPointer);
  garden.addEventListener("pointercancel", endPointer);

  // ---------- Toolbar ----------
  const HINTS = {
    rake: "Arrastra para rastrillar la arena",
    ripple: "Mantén pulsado para dibujar ondas",
    stone: "Toca para colocar una piedra. Arrástrala para moverla o tócala para quitarla",
    smooth: "Pasa el dedo para alisar la arena",
  };
  const tinesEl = document.getElementById("tines");
  function setTool(t) {
    tool = t;
    document.querySelectorAll(".tool[data-tool]").forEach(b => b.setAttribute("aria-pressed", b.dataset.tool === t));
    tinesEl.classList.toggle("off", t !== "rake");
    hintEl.textContent = HINTS[t];
    hintEl.style.opacity = usedTools.has(t) ? 0 : 1;
    garden.style.cursor = t === "stone" ? "pointer" : "crosshair";
  }
  document.querySelectorAll(".tool[data-tool]").forEach(b => b.addEventListener("click", () => { initAudio(); setTool(b.dataset.tool); }));
  document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
    tines = +b.dataset.tines;
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
  }));
  document.getElementById("t-sound").addEventListener("click", () => { initAudio(); setSound(!soundOn); });

  // "Nuevo": hold to rake the whole garden again, so nothing is erased by accident
  const newBtn = document.getElementById("t-new");
  let holdTimer = 0;
  function startSweep() {
    initAudio();
    if (sweep) return;
    sweep = { x: -SP * 2, speed: W / 2600 };
    haptic(6);
  }
  newBtn.addEventListener("pointerdown", e => {
    initAudio();
    newBtn.classList.add("holding");
    holdTimer = setTimeout(() => { newBtn.classList.remove("holding"); startSweep(); }, 800);
  });
  const cancelHold = () => { clearTimeout(holdTimer); newBtn.classList.remove("holding"); };
  newBtn.addEventListener("pointerup", cancelHold);
  newBtn.addEventListener("pointerleave", cancelHold);
  newBtn.addEventListener("pointercancel", cancelHold);
  newBtn.addEventListener("click", e => { if (e.detail === 0) startSweep(); });

  function sweepStep(dt) {
    const x0 = sweep.x, x1 = Math.min(W + SP * 2, x0 + sweep.speed * dt), edge = 8 * K;
    const a = Math.max(0, Math.floor(x0 - edge)), b = Math.min(W, Math.ceil(x1));
    for (let y = 0; y < H; y++) for (let x = a; x < b; x++) {
      const i = y * W + x;
      if (mask[i]) continue;
      const w = 1 - smooth(x1 - edge, x1, x);
      hgt[i] += (linePattern(x, y) - hgt[i]) * w;
    }
    markDirty(a, 0, b, H);
    sweep.x = x1;
    audTarget = 0.55; lastMoveT = performance.now();
    if (x1 >= W + SP * 2) {
      for (const st of stones) stoneRings(st);
      sweep = null; audTarget = 0;
    }
  }

  window.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const map = { "1": "rake", "2": "ripple", "3": "stone", "4": "smooth" };
    if (map[e.key]) setTool(map[e.key]);
    else if (e.key === "s" || e.key === "S") { initAudio(); setSound(!soundOn); }
  });
  document.addEventListener("visibilitychange", () => { if (ac) document.hidden ? ac.suspend() : ac.resume(); });
  let rt = 0;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => setup(true), 160); });

  // ---------- Ghost demo: if nobody touches the garden, a faint rake shows how ----------
  function startDemo() {
    if (interacted || reduceMotion) return;
    const portrait = H > W;
    const y0 = H * (portrait ? 0.27 : 0.25), xa = W * 0.12, xb = W * (portrait ? 0.86 : 0.55);
    demo = { t: 0, dur: 2800, path: e => ({ x: xa + (xb - xa) * e, y: y0 + Math.sin(e * TAU * 0.9) * H * 0.04 }) };
    const p = demo.path(0);
    demo.s = { x: p.x, y: p.y, dx: 1, dy: 0 };
  }
  setTimeout(startDemo, 2200);

  let lastActivity = performance.now();
  const wake = () => { lastActivity = performance.now(); document.body.classList.remove("zen"); };
  ["pointerdown", "pointermove", "keydown"].forEach(ev => window.addEventListener(ev, wake, { passive: true }));

  // ---------- Main loop ----------
  let lastT = performance.now(), t0 = lastT;
  function frame(now) {
    const dt = Math.min(50, now - lastT); lastT = now;

    if (ptr && tool === "ripple" && ptr.growing) {
      const maxR = clamp(Math.min(W, H) * 0.42, 90 * K, 300 * K);
      if (ptr.r < maxR) {
        ptr.rPrev = ptr.r;
        ptr.r = Math.min(maxR, ptr.r + dt * 0.075 * K);
        rippleStamp(ptr.sx, ptr.sy, ptr.rPrev, ptr.r);
        const rings = Math.floor(ptr.r / SP);
        if (rings > ptr.rings) { ptr.rings = rings; tick(ptr.sx); haptic(3); }
        audTarget = 0.28; lastMoveT = now;
      } else { ptr.growing = false; audTarget = 0; }
    }

    if (sweep) sweepStep(dt);

    if (rk) {
      // The finger holds the end of the handle; the head is dragged behind it at handle length.
      const L = handleLen(), vx = rk.tx - rk.x, vy = rk.ty - rk.y, d = Math.hypot(vx, vy);
      if (d > L) {
        if (!rk.has) { rk.dx = vx / d; rk.dy = vy / d; rk.has = true; }
        const dist = strokeTo(rk, rk.tx - vx / d * L, rk.ty - vy / d * L, rk.n, "rake");
        if (dist) {
          feedSpeed(dist / K, dt);
          rk.travel += dist / K;
          if (rk.travel > 40) { rk.travel = 0; haptic(2); }
        }
      }
      if (d > 0.5) {
        const hx = rk.tx - rk.x, hy = rk.ty - rk.y, hl = Math.hypot(hx, hy) || 1;
        Object.assign(rakeVis, { x: rk.x, y: rk.y, dx: hx / hl, dy: hy / hl, hx: rk.tx, hy: rk.ty, on: true, ghost: false, n: rk.n });
      }
      if (rk.releasing) {
        if (rk.has) moundStamp(rk.x, rk.y, rk.dx, rk.dy, rk.n);
        rk = null; rakeVis.on = false;
      }
    }

    if (demo) {
      demo.t += dt;
      const u = Math.min(1, demo.t / demo.dur), e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      const p = demo.path(e);
      strokeTo(demo.s, p.x, p.y, 5, "rake");
      const hL = handleLen();
      Object.assign(rakeVis, { x: p.x, y: p.y, dx: demo.s.dx, dy: demo.s.dy, hx: p.x + demo.s.dx * hL, hy: p.y + demo.s.dy * hL, on: u < 1, ghost: true, n: 5 });
      if (u >= 1) { moundStamp(p.x, p.y, demo.s.dx, demo.s.dy, 5); demo = null; }
    }

    rakeVis.a += ((rakeVis.on ? 1 : 0) - rakeVis.a) * 0.2;
    for (const st of stones) {
      st.lift += ((st.lifted && ptr && ptr.stone === st ? 1 : 0) - st.lift) * 0.25;
      if (st.bounce > 0) st.bounce = Math.max(0, st.bounce - dt / 150);
    }
    for (let k = grains.length - 1; k >= 0; k--) {
      const g = grains[k]; g.life += dt; g.x += g.vx * dt; g.y += g.vy * dt; g.vx *= 0.9; g.vy *= 0.9;
      if (g.life > g.max) grains.splice(k, 1);
    }

    if (!reduceMotion) {
      nextPetal -= dt;
      if (nextPetal <= 0 && petals.length < 4) { spawnPetal(); nextPetal = rand(9000, 18000); }
      for (let k = petals.length - 1; k >= 0; k--) {
        const p = petals[k];
        p.life += dt;
        if (!p.landed) {
          p.ph += dt * 0.004;
          p.x += (p.vx + Math.sin(p.ph * 0.7) * 0.012 * K) * dt;
          p.y += (p.vy + Math.cos(p.ph) * 0.006 * K) * dt;
          p.rot += p.vr * dt;
          p.alpha = Math.min(1, p.life / 800) * 0.92;
          if (p.y > H * p.land || p.x > W * 0.95) { p.landed = true; p.ph = 0.3; p.rest = 0; }
        } else {
          p.rest += dt;
          p.alpha = 0.85 * (1 - smooth(10000, 16000, p.rest));
          if (p.rest > 16000) petals.splice(k, 1);
        }
      }
      const el = (now - t0) / 1000;
      const cx = (Math.sin(el / 190) * 0.5 + 0.5) * 30, cy = (Math.cos(el / 260) * 0.5 + 0.5) * 18;
      cloudsEl.style.transform = `translate(${-cx}vw, ${-cy}vh)`;
      const sway = Math.sin(el * TAU * 0.03) * 1.2 + Math.sin(el * 1.7) * 0.25;
      leavesEl.style.transform = `rotate(${sway}deg)`;
      warmEl.style.opacity = (0.04 + 0.035 * Math.sin(el / 600 * TAU)).toFixed(3);
    }

    if (!ptr && !rk && now - lastActivity > 8000) document.body.classList.add("zen");

    flush();
    drawTop(now);
    updateAudio(now, dt);
    requestAnimationFrame(frame);
  }

  // ---------- First garden: raked lines and a sanzon stone group ----------
  setup(false);
  {
    const base = clamp(Math.min(W, H) / K * 0.08, 28, 70) * K;
    const portrait = H > W;
    const group = portrait
      ? [[0.62, 0.42, 1.0], [0.79, 0.50, 0.58], [0.30, 0.67, 0.72]]
      : [[0.64, 0.46, 1.0], [0.74, 0.58, 0.58], [0.28, 0.64, 0.74]];
    for (const [fx, fy, k] of group) { const st = addStone(W * fx, H * fy, base * k); st.bounce = 0; }
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
